<title>An den Ausschuß der Sozialdemokratischen deutschen Arbeiterpartei</title>
</head>
<body>
<p>Prügel besehen, daß sie genug daran haben. Wie Herr Bismarck diese Sachen in der englischen Presse darstellt, zeigt der inl. Ausschnitt, der die Runde durch alle Blätter macht. Der „North German Corr[espondence]“ ist ein mit Welfengeld gegründetes Organ des Bismarck.<a id="A323"></a></p>
<p align="right">Mit besten Grüßen</p>
<p align="right"><i>F.Engels</i></p>
