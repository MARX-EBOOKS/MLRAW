<title>An den Redakteur der „Eastern Post“</title>
</head>
<body>
<p>Für mich ist Herr Charles Bradlaugh erledigt, und ich überlasse es ihm, sich in aller Beschaulichkeit an der ruhigen Betrachtung seines eignen Ichs zu ergötzen.</p>
<p align="right">Ich verbleibe, Sir, Ihr ergebener<br><i>Karl Marx</i></p>
<p style="text-indent: 0;">Geschrieben um den 27. Januar 1872.<br>Aus dem Englischen.</p>
</body>
