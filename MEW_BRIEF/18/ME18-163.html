<title>An den Herrn Redakteur des „Corsaire“</title>
</head>
<body>
<p>Die Arbeiteröffentlichkeit von Den Haag und von Amsterdam war dem Kongreß höchst wohlwollend gesonnen.</p>
<p>Soviel sind also die Berichte der reaktionären Presse wert.</p>
<p align="right">Ich habe die Ehre, Sie zu grüßen.</p>
<p align="right"><i>Karl Marx</i></p>
<p style="text-indent: 0;">Den Haag, 12.September 1872</p>
<p>Aus dem Französischen.</p>
</body>
