<p>12. Was ist aus Mac Donnel geworden? Er muß längst dort sein. Ich höre und sehe nichts von ihm.</p>
<p align="right">Postschluß – Beste Grüße</p>
<p align="right"><i>F.Engels</i></p>
<p style="text-indent: 0;">L[ondon], 8.Febr. 1873<sup><a id="ZF1" href="#F1">1</a></sup></p>
<p>Nach der Handschrift.</p>
<aside>
<p><a id="F1" href="#ZF1">1</a> In der Handschrift versehentlich: 1872</p>
</aside>
