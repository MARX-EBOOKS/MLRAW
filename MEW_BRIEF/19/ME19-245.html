<title>An das Slawische Meeting zum Jahrestag der Pariser Kommune</title>
</head>
<body>
<p>So führt die Kommune, die die Mächte der alten Welt glaubten, ausgerottet zu haben, ein kraftvolleres Leben denn je, und so können wir mit Ihnen in den Ruf einstimmen: „Vive la Commune!“</p>
<p style="text-indent: 0;">Geschrieben am 21. März 1881.<br>
Nach der Handschrift.<br>
Aus dem Englischen.</p>
