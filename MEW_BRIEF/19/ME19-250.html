<title>Friedrich Engels</title>
</head>
<body>
<p style="text-indent: 0;">Kapitals. Begrabt darum den alten Wahlspruch für immer, und ersetzt ihn durch einen anderen:</p>
<p><b>Besitzer der Arbeitsmittel – der Rohstoffe, Fabriken und Maschinen – soll das arbeitende Volk selbst sein.</b></p>
<p style="text-indent: 0;">Geschrieben am 1./2. Mai 1881.<br>
Aus dem Englischen.</p>
