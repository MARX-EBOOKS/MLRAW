<p style="text-indent: 0;">sein, Magyaren, Deutsche, Rumänen, Serben und Slowaken zu umfassen, dieser jungen Partei wollen Sie so freundlich sein, meine besten Wünsche zu ihrem Parteitage zu überbringen.</p>
<p align="center" style="text-indent: 0;">Hoch die internationale Sozialdemokratie!<br>Hoch der ungarländische Parteitag!</p>
<p align="right"><i>Friedrich Engels</i></p>
