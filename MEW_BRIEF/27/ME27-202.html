<title>64 · Engels an Marx · 25. Februar 1851</title>
</head>
<body>
<p>Diese Glossen, wie Du siehst, beschränken sich rein auf Deinen modus illustrandi<sup><a id="ZF13" href="#F13">13</a></sup>; die Sache selbst ist vollständig in Ordnung.</p>
<p align="right">Dein</p>
<p align="right"><i>F.E.</i></p>
<p style="text-indent: 0;">[Manchester] Dienstag, 25. Febr. [1851]</p>
