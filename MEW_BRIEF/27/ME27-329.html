<p style="text-indent: 0;">zweite Teil ist wirklich gar nicht ernsthaft zu behandeln, man kann's beim besten Willen nicht.</p>
<p>Für die „Tribune“ hab' ich natürlich auch nichts machen können – nächste Woche Fortsetzung. Eiligst</p>
