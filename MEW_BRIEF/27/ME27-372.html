<title>129 · Marx an Engels · 24. November 1851</title>
</head>
<body>
<p>Schramm<sup><a id="ZF12" href="#F12">12</a></sup>, mit einer zudringlichen Zähigkeit sans pareil<sup><a id="ZF13" href="#F13">13</a></sup>, sucht sich wieder bei mir einzubürgern. Il n'y parviendra pas.<sup><a id="ZF14" href="#F14">14</a></sup></p>
<p>Was machen die „Pottfahrten“ von K. Schnapper?<a id="A292"></a></p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F12" href="#ZF12">12</a> Conrad Schramm</p>
<p><a id="F13" href="#ZF13">13</a> ohnegleichen</p>
<p><a id="F14" href="#ZF14">14</a> Es wird ihm nicht gelingen.</p>
</aside>
