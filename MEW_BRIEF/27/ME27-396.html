<title>1 · Marx an Arnold Ruge · 10. Februar 1842</title>
</head>
<body>
<p>Da ich jetzt mit weitschweifigen Arbeiten am Abschluß bin, versteht es sich von selbst, daß den „Deutschen Jahrbüchern“ alles, was meine Kräfte vermögen, zu Gebote steht.</p>
<p align="right">Mit aufrichtiger Hochachtung<br><i>Marx</i></p>
<p>Meine Adresse ist: An Dr. Marx zu <i>Trier</i>, abzugeben an Geh. Regierungsrat von Westphalen.</p>
