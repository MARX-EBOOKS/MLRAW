<title>29 · Engels und Marx an Moses Heß · 27. Juli 1846</title>
</head>
<body>
<p>Ich habe den Westfalen<a id="A31"></a> geschrieben, das Manuskript an Daniels zu schicken. Hat der es noch nicht, so laß Dir den Aufsatz über Ruge direkt von ihnen schicken.</p>
<p>Was ist denn das für ein Buch von Heinzen?<a id="A362"></a> Und was schreibt Dottore Graziano über Dich?<a id="A363"></a> Schreib mir das.</p>
