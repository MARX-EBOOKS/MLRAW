<title>31 · Marx an Pawel Wassiljewitsch Annenkow · 28. Dezember 1846</title>
</head>
<body>
<p>Ich wäre Ihnen sehr dankbar, wenn Sie mit Ihrer Antwort nicht zu lange warteten, damit ich weiß, ob Sie mich unter dieser Hülle eines barbarischen Französisch verstanden haben.</p>
<p style="text-indent: 0;">Nach: М. М. Стасюлевичъ и его современники въ ихъ перепискѣ, томъ III, спб. 1912.</p>
<p style="text-indent: 0;">Aus dem Französischen.</p>
