<title>58 · Marx an Ferdinand Freiligrath · 31. Juli 1849</title>
</head>
<body>
<p>Diese Stellung der englischen Bourgeoisie zu dem kontinentalen Despotismus ist die Umkehrung des Feldzugs, den sie von 1793 bis 1815 gegen Frankreich führten. Dieser Entwicklung kann man nicht genug Wichtigkeit beilegen.</p>
<p>Beste Grüße an Dich und Deine Frau von mir und Frau</p>
<p align="right">Dein</p>
<p align="right"><i>K. Marx</i></p>
</body>
