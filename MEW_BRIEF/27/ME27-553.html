<h1>93<br>Marx an Roland Daniels<br>in Köln</h1>
<p align="right">[London, Mai 1851]</p>
<p>… Die Kommunisten haben zu zeigen, daß nur unter kommunistischen Verhältnissen die schon erreichten technologischen Wahrheiten praktisch werden können…</p>
<p style="text-indent: 0;">Nach: Brief von Roland Daniels an Marx vom 1. Juni 1851.</p>
