<title>15 · Engels an Marx · 2. März 1852</title>
</head>
<body>
<p>Das Buch von Ewerbeck schick mir ja nicht. Es ist die 6 d. nicht wert, die das Porto kosten würde.</p>
<p>Grüß Deine Frau und Kinder bestens.</p>
<p align="right">Dein<br><i>F.E.</i></p>
<p style="text-indent: 0;">Manchester, 2. März 1852</p>
</body>
