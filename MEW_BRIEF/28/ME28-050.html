<h1>21<br>Marx an Engels<br>in Manchester</h1>
<p align="right">14. April 1852<br>28, Dean Street, Soho, London</p>
<p>Lieber Frederic,</p>
<p>Ich schreibe Dir nur diese 2 Zeilen, um anzuzeigen, daß das kleine Kind<sup><a id="ZF1" href="#F1">1</a></sup> heute <sup>1</sup>/<sub>4</sub> nach 1 Uhr gestorben ist.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F1" href="#ZF1">1</a> Marx' Töchterchen Franziska</p>
</aside>
