<title>46 · Marx an Engels · 5. August 1852</title>
</head>
<body>
<p>Ich habe allerlei Zeug von Cluß auch an Dich zu schicken, die Du erhältst, sobald Du einige stamps<sup><a id="ZF8" href="#F8">8</a></sup> einlegst, da der Dreck Dir sonst das Doppelte kostet und ich pour le moment<sup><a id="ZF9" href="#F9">9</a></sup> keinen Penny zu entsenden habe. Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
