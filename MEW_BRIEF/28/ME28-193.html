<title>86 · Marx an Engels · 10. November 1852</title>
</head>
<body>
<p>Gruß [an Weerth.]<sup><a id="ZF12" href="#F12">12</a></sup> Vehse gestern abgereist. Nach Frankfurt schon wegen unsrer Broschüre<a id="A1941"></a> geschrieben. Schreiben wir nicht, so bemächtigt sich Becker <i>ad maiorem gloriam Beckeri</i><sup><a id="ZF13" href="#F13">13</a></sup> der ganzen Geschichten.</p>
<aside>
<p><a id="F12" href="#ZF12">12</a> Tintenfleck</p>
<p><a id="F13" href="#ZF13">13</a> <i>zum höheren Ruhme Beckers</i></p>
</aside>
</body>
