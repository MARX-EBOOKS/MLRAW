<title>Marx an Engels · 9. Februar 1854</title>
</head>
<body>
<p>Wenn Du für Dienstag irgend etwas machen kannst, wäre es mir sehr gelegen, da ich an <i>demselben</i> Tag nach dem Cape of Good Hope<sup><a id="ZF12" href="#F12">12</a></sup> schreiben muß<sup><a id="ZF13" href="#F13">13</a></sup>.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F12" href="#ZF12">12</a> Kap der Guten Hoffnung</p>
<p><a id="F13" href="#ZF13">13</a> d.h. für die Zeitung „De Zuid-Afrikaan“, in Kapstadt (siehe auch vorl. Band, S. 315)</p>
</aside>
</body>
</html>
