<title>189 · Marx an Engels · 2. Dezember 1854</title>
</head>
<body>
<p>Hast Du Jacobus Venedey – Kobes I.<sup><a id="ZF27" href="#F27">27</a></sup> von Köln – Schimpfereien auf Heine im Feuilleton der „Köln[ischen] Zeit[ung]“ vom Samstag gelesen? Diesen Genuß mußt Du Dir nicht versagen. Und Kossuths Avancieren zum General!!!</p>
<aside>
<p><a id="F27" href="#ZF27">27</a> Titel eines Spottgedichts von Heine auf Venedey</p>
</aside>
