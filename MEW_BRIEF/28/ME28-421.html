<title>191 · Marx an Engels · 15. Dezember 1854</title>
</head>
<body>
<p>Morgen habe ich den Blind und Gattin auf dem Halse. Dieser „finschtre" Russenhasser und „Repelbikaner" bleibt dabei, daß Baden das wahre Land der Zukunft ist.</p>
<p><i>Salut. Grüß auch den Lupus von mir.</i></p>
<p align="right">Dein<br><i>K.M.</i></p>
</body>
