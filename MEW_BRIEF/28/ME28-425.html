<h1>195<br>Marx an Engels<br>in Manchester</h1>
<p align="right">[London] 24. Januar [1855]</p>
<p>Dear Engels!</p>
<p>Du wirst aus der heutigen „<i>Times</i>" ersehn, daß <i>nichts</i> über das Parlament zu berichten. Wichtige Debatte erst <i>Donnerstag abend</i>. Bleibt also nichts übrig, als „<i>irgendwelches</i> sujet" vorzunehmen.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
