<title>1 · Marx an Joseph Weydemeyer · 1. Januar 1852</title>
</head>
<body>
<p>Schicke mir gleich (und fortlaufend) einige Exemplare Deiner Wochenschrift.</p>
<p>Salut et fraternité.<sup><a id="ZF6" href="#F6">6</a></sup></p>
<p align="right">Dein</p>
<p align="right"><i>K. Marx</i></p>
<p>An dem Freiligrath hab' ich gestern möglichst gehämmert, und er mir versprochen, ein Gedicht bezüglich der neuesten Ereignisse für Dich zu fabrizieren.</p>
<aside>
<p><a id="F6" href="#ZF6">6</a> Groß und Brüderlichkeit.</p>
</aside>
</body>
