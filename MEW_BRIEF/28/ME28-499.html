<title>12 · Marx an Ferdinand Lassalle · 23. Februar 1852</title>
</head>
<body>
<p style="text-indent: 0;">Wenn es nur gelingt, die Zwischepoche sich durchzudrücken tant bien que mal<sup><a id="ZF18" href="#F18">18</a></sup>. Die Poststunde rückt heran. Ich schließe.</p>
<p>Salut.</p>
<p align="right"><i>K. Marx</i></p>
<aside>
<p><a id="F18" href="#ZF18">18</a> so gut wie möglich</p>
</aside>
