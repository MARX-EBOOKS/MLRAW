<title>17 · Marx an Adolf Cluß · 22. April 1852</title>
</head>
<body>
<p style="text-indent: 0;">der meisten Rohprodukte in Abwesenheit aller großen Spekulation lassen auf eine außerordentlich verlängerte Dauer der Prosperität schließen. Es ist möglich, daß die Geschichte bis Frühjahr fortdauert, etc. etc. etc...</p>
<p style="text-indent: 0;">Nach: Brief von Cluß an Weydemeyer vom 6. Juni 1852.</p>
