<title>30 · Marx an Peter Imandt · 27. August 1852</title>
</head>
<body>
<p>Einige Witze über den „Unionsvertrag"<a id="A137"></a> könntest Du in beiden Briefen einfließen lassen.</p>
<p>Schick mir möglichst bald die Papiere zurück, damit ich nach Deutschland und nach Amerika (dahin geht die nächste Post am Dienstag) „schleunigst" berichten kann.</p>
<p>Salut</p>
<p align="right">Dein<br><i>K.M.</i></p>
</body>
