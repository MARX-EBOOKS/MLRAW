<title>61 · Marx an Moritz Elsner · 11. September 1855</title>
</head>
<body>
<p>Es hat sich hier in London ein deutsches Wochenblättchen aufgetan, gestiftet von dem französischen Ex(?)polizisten und Wiener Flüchtling Sigmund Engländer. Mitarbeiter: der <i>Russe</i> Herzen, Johannes Ronge und ein versoffner angeblicher Capitaine namens Korn.</p>
