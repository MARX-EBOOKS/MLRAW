<title>15 · Adolf Cluß an Joseph Weydemeyer · 12. Dezember 1853</title>
</head>
<body>
<p style="text-indent: 0;"><i>kann</i> nicht schreiben in diesem Moment. Karl hat daher den Heise angespannt und ihn im Lesekabinett abonniert, da er den penny nicht hatte. Auch nach Deutschland hat er um Sukkurs<sup><a id="ZF13" href="#F13">13</a></sup> geschrieben." – Den Passus Heise betrachte konfidentiell.</p>
<p align="right">Dein<br><i>Ad. Cluß</i></p>
