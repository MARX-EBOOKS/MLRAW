<title>4 · Marx an Engels · 13. Februar 1856</title>
</head>
<body>
<p>Fridolin<sup><a id="ZF14" href="#F14">14</a></sup> gekitzelt wurde. Er hielt indes sein rendezvous mit der „cow"<sup><a id="ZF15" href="#F15">15</a></sup>. Das also sind seine „adventures"<sup><a id="ZF16" href="#F16">16</a></sup>. O König Wiswamitra, was für ein Ochs bist Du!<a id="A21"></a></p>
<p>Vergiß den Panslawismus<a id="A12"></a> nicht.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F14" href="#ZF14">14</a> Wilhelm Pieper</p>
<p><a id="F15" href="#ZF15">15</a> „Kuh"</p>
