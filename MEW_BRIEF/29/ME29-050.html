<title>12 · Marx an Engels · 26. April 1856</title>
</head>
<body>
<p>In der „Presse" (Paris) erbaulicher Krakeel gegen Bonapartes législateur poète<sup><a id="ZF9" href="#F9">9</a></sup> – Belmontet – von Pelletan, worin letztrer den „empereur"<sup><a id="ZF10" href="#F10">10</a></sup> so beleidigt hat, daß er wahrscheinlich expulsiiert wird.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F9" href="#ZF9">9</a> gesetzgebenden Poeten</p>
<p><a id="F10" href="#ZF10">10</a> „Kaiser"</p>
</aside>
