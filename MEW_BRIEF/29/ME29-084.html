<p style="text-indent: 0;">screw<sup><a id="ZF15" href="#F15">15</a></sup>, da dieses der einzig interessante Punkt für mich ist im intercourse with those Calibans<sup><a id="ZF16" href="#F16">16</a></sup>.</p>
<p>Schreib bald über Dich selbst und Umgebung. Mit besten Grüßen von Frau und Kind.</p>
<p>Kinder sehr wohl.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F15" href="#ZF15">15</a> einen Druck ausüben</p>
<p><a id="F16" href="#ZF16">16</a> Verkehr mit diesen Calibans</p>
</aside>
