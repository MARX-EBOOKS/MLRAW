<title>Engels an Marx · 11. Dezember 1857</title>
</head>
<body>
<p style="text-indent: 0;">Mercks in Hamburg ist der Ex-Reichsminister Dr. Ernst Merck, Jurist, aber Associé.</p>
<p>Beste Grüße an Deine Frau und Kinder. Auf Deinen Brief über Frankreich pp. hab’ ich heut keine Zeit einzugehn, il faudrait trop réfléchir<sup><a id="ZF17" href="#F17">17</a></sup>.</p>
<p align="right">Dein<br><i>F. E.</i></p>
<aside>
<p><a id="F17" href="#ZF17">17</a> er erforderte zuviel Nachdenken</p>
</aside>
</body>
