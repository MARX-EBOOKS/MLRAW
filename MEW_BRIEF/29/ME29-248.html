<title>109 · Marx an Engels · 5. Januar 1858</title>
</head>
<body>
<p>Also, my boy, try to come to a definitive resolution – one way or the other<sup><a id="ZF8" href="#F8">8</a></sup>.</p>
<p>Besten Gruß.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F8" href="#ZF8">8</a> mein Junge, versuche zu einem endgültigen Entschluß zu kommen – so oder so</p>
</aside>
