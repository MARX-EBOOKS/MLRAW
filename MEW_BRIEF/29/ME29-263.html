<title>117 · Marx an Engels · 23. Januar 1858</title>
</head>
<body>
<p>London eingetroffen; das erstemal Platz verlassen habend infolge des Attentats<a id="A250"></a>.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<p>In der Pariser Korrespondenz des „M[anchester] G[uardian]“, den Du mir geschickt, waren nette Sachen. Wie steht das Geschäft in Manchester? Es scheint alles besser zu gehn als erwartet.</p>
