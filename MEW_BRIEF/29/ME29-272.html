<title>122 · Engels an Marx · 30. Januar 1858</title>
</head>
<body>
<p>Ich werde Charras' „<i>Cent jours</i>“<a id="A253"></a> kommen lassen. Könnten wir nicht in Amerika literarische Kritik treiben? Ein Artikel darüber wäre gewiß interessant und nicht schwer zu machen.</p>
<p>Viele Grüße an Frau und Kinder.</p>
<p align="right">Dein<br><i>F. E.</i></p>
