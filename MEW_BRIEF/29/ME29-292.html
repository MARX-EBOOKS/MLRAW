<p style="text-indent: 0;">in der Erklärung des mehrjährigen Zyklus, den die industrielle Bewegung durchläuft, seit die große Industrie sich konsolidiert hat.</p>
<p>Was macht lupus? Grüß ihn von mir.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<p>Heut wieder batch of<sup><a id="ZF34" href="#F34">34</a></sup> „Guardians" angekommen. Auch vorige Woche erhalten „Bidassoa".</p>
