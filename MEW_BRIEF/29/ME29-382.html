<h1>177<br>Marx an Engels<br>in Manchester</h1>
<p align="right">[London] 8. Jan. 1859</p>
<p>Dear Frederick,</p>
<p>Einliegend Brief von Freiligrath. (Ich hatte ihm einiges geschrieben über die Kinkelaaffaire.) Prospekt des „Hermann“.<a id="A331"></a> Brief des Herrn Willich.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
