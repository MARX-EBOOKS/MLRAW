<title>178 · Marx an Engels · zwischen dem 13. und 15. Januar 1859</title>
</head>
<body>
<p><i>Ruge in den amerikanischen Blättern tritt als fanatischer Vorkämpfer des Prinzen von Preußen auf.</i> <i>Schramm</i><sup><a id="ZF9" href="#F9">9</a></sup> hat die Erlaubnis erhalten (der Steckbrief gegen ihn zurückgenommen), nach Preußen zurückzukehren und ohne Präventivhaft sich einer neuen Jury zu stellen.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F9" href="#ZF9">9</a> Rudolf Schramm</p>
</aside>
</body>
