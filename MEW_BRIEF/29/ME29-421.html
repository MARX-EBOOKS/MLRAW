<title>203 · Marx an Engels · 16. April 1859</title>
</head>
<body>
<p>Sei so gut und schick 1 Kopie<sup><a id="ZF7" href="#F7">7</a></sup> für mich. Sobald mehre in Deiner Hand, muß Freiligr[ath] und Pfänder jeder 1 haben.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F7" href="#ZF7">7</a> Engels: „<b>Po und Rhein</b>“</p>
</aside>
</body>
