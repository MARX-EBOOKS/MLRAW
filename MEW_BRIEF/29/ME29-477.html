<title>Marx an Engels · 26. August 1859</title>
</head>
<body>
<p>Dronke Lumpazius hatte nicht für 1 Exemplar abonniert. Dein Vetter S[iebel] aber, wie Du aus Beiliegendem siehst, ist „Hermanns“-Dichter unter Betas Leitung.<a id="A428"></a></p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
