<p>und mich glaubte er durch Collet lahmlegen zu können. The fool!<sup><a id="ZF13" href="#F13">13</a></sup> Gleichzeitig wollte er von C[ollet] wissen, wer das über K[ossuth] in der „Press" geschrieben.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
