<title>25 · Marx an Ferdinand Lassalle · 4. Februar 1859</title>
</head>
<body>
<p>Es wäre mir sehr wichtig, wenn Du in <i>Breslau</i> Details über eine Person weiblichen Geschlechts, die sich dort aufhielt und <i>jetzt hier</i> ist, namens (angeblich) von Paula-Kröcher, erhalten und mir <i>möglichst bald</i> zuschicktest.</p>
