<title>33 · Engels an Elisabeth Engels · 20. April 1859</title>
</head>
<body>
<p>Du brauchst natürlich der Frau Siebel das nicht alles haarklein zu erzählen, was ich Dir über den Carl geschrieben habe.</p>
<p>Ich gratuliere Dir auch noch von ganzem Herzen zu Deinem Geburtstage und hoffe, daß ich noch oft, sehr oft Dir werde dazu Glück wünschen können!</p>
</body>
