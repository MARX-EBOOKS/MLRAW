<title>44 · Marx an Ferdinand Lassalle · 14. November 1859</title>
</head>
<body>
<p style="text-indent: 0;">Artikel 1 lautet: „Alle Politik ist statutenmäßig ausgeschlossen von den Gesellschaftsdebatten.“ Dieselben Burschen standen vor 1848 unter Bunsens Protektion.</p>
<p>Doch genug des Geschwatzes, da diese Zeilen bloß de re pecuniaria<sup><a id="ZF8" href="#F8">8</a></sup> handeln sollten.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
