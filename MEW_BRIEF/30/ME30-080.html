<title>47 · Engels an Marx · um den 23. Juli 1860</title>
</head>
<body>
<p>Tagen fertig. Er muß jetzt 5-6000 haben, die Sizilianer natürlich ungerechnet.</p>
<p>Inl. fünf Pfund, damit wirst Du den armen Eccarius wohl wieder etwas voranbringen können.</p>
<p align="right">Dein<br><i>F. E.</i></p>
