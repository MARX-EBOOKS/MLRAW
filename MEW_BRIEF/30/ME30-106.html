<h1>64<br>Marx an Engels<br>in Manchester</h1>
<p align="right">[London] 11. Okt. 1860</p>
<p>Dear Frederick,</p>
<p>Ich bin sehr beschäftigt diesen Augenblick. Schreibe Dir am Sonnabend. Broschüre von Braß<a id="A135"></a> einiges Gute drin.</p>
<p>Wo möglich, schick mir ein paar Instrukionszeilen (bis Sonnabend) über Garibaldis <i>grand battle</i>.<a id="A131"></a></p>
<p align="right">Dein</p>
<p align="right"><i>K.M.</i></p>
