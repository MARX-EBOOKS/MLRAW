<p>So viel über diesen Froschmäuslerkrieg<a id="A227"></a>. Du wirst gesehn haben, daß selbst der „Kladderadatsch“ ein paar Späße gegen den edlen Dichter gebracht.</p>
<p>Salut.</p>
<p align="right">Dein</p>
<p align="right"><i>K.M.</i></p>
