<title>126 · Engels an Marx · 5. März 1862</title>
</head>
<body>
<p>Übrigens hat nach Deiner Angabe der Handel nach China sich doch bedeutend vermehrt. Vor 10 Jahren, soviel ich mich erinnere, war's 1–3 Millionen wechselnd.</p>
<p>Wie geht's Jennychen? Grüße sie, Deine Frau und Laura herzlich.</p>
<p align="right">Dein<br><i>F. E.</i></p>
</body>
</html>
