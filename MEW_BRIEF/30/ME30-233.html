<title>131 · Engels an Marx · 5. Mai 1862</title>
</head>
<body>
<p>Wie ist's mit Wein für Jennychen? Sage mir, welche Sorten Allen am meisten empfiehlt. Ich kann jetzt auch einigen Portwein schicken, der <i>sehr</i> zu empfehlen ist, alt, leicht, ohne Schnaps; aber nur, nach dem er <i>gut filtriert</i> ist, die Kruste ist lose geworden.</p>
<p>Herzliche Grüße.</p>
<p align="right">Dein<br><i>F. E.</i></p>
</body>
