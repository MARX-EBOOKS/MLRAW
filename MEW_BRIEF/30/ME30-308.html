<title>174 · Marx an Engels · 2. Januar 1863</title>
</head>
<body>
<p style="text-indent: 0;"><i>Der alte Heiman</i><sup><a id="ZF11" href="#F11">11</a></sup> ist glücklich in Abrahams Schoß übergesiedelt. Gruß und <i>compliments of the season to the ladies</i><sup><a id="ZF12" href="#F12">12</a></sup>.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<p>Ich sehe, daß die Baumwollpreise gefallen. Dies jedoch nur temporär nach meiner Ansicht.</p>
<aside>
<p><a id="F11" href="#ZF11">11</a> Heiman Lassal</p>
<p><a id="F12" href="#ZF12">12</a> Neujahrsgrüße an die Damen (Mary und Lizzy Burns)</p>
</aside>
</body>
</html>
