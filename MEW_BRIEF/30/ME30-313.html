<title>177 · Engels an Marx · 13. Januar 1863</title>
</head>
<body>
<p style="text-indent: 0;">Garantien haben. Das Fehlende müßtest Du dann unbedingt aus dem Holländer Onkel<sup><a id="ZF8" href="#F8">8</a></sup> herausschlagen.</p>
<p>Einen andern Weg sehe ich nicht.</p>
<p>Laß mich also wissen, was Du für Schritte tust, und ich werde das Meinige tun.</p>
<p align="right">Dein</p>
<p align="right"><i>F. E.</i></p>
<aside>
<p><a id="F8" href="#ZF8">8</a> Lion Philips</p>
</aside>
</body>
</html>
