<p>Soeben erseh' ich aus der 2<sup>nd</sup> edition<sup><a id="ZF5" href="#F5">5</a></sup> der „<i>Times</i>", daß die preußische 2te Kammer endlich was Gutes getan.<a id="A349"></a> Wir werden bald Revolution haben.</p>
