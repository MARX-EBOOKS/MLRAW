<title>189 · Engels an Marx · 8. April 1863</title>

<p>schönes Zeug stehen mag, da ich absolut keine Erinnerung habe, was ich schrieb.<a id="A357"></a> Damit Du aber den wahren Zusammenhang siehst, habe ich die Sache jetzt noch eben erwähnt.</p>
<p>Vale,</p>
<p align="right">Dein<br><i>F. E.</i></p>
