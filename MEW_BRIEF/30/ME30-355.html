<title>196 · Engels an Marx · 11. Juni 1863</title>
</head>
<body>
<p>Ich lese jetzt Kinglake<a id="A370"></a>, der mich mehr und mehr in der Überzeugung bestärkt, daß jeder Engländer irgendwo in seinem Gehirn ein Brett vorgengelt hat, wo alles aufhört.</p>
<p align="right">Dein<br><i>F. E.</i></p>
</body>
