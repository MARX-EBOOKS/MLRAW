<title>197 · Marx an Engels · 12. Juni 1863</title>
</head>
<body>
<p style="text-indent: 0;">die „<i>Bourgeois</i>“ loszufahren, als auf die „<i>Russen</i>“. Auf die Östreicher schimpfen und für Italien schwärmen war von jeher ebenso spezifisch berlinisch, als den Russen gegenüber das Maul halten, wie es der tapfre Junge tut.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
