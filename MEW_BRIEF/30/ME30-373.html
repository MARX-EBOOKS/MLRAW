<title>202 · Marx an Engels · 12. September 1863</title>
</head>
<body>
<p style="text-indent: 0;">besten wissen, ob in Manchester etwas in dieser line<sup><a id="ZF12" href="#F12">12</a></sup> zu tun ist. Die Sache selbst wäre vorzüglich.</p>
<p>Grüß lupum und sag ihm, daß ich seinen Brief an Eccarius besorgt.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
