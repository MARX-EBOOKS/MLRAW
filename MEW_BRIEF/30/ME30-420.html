<title>228 · Engels an Marx · 5. Juli 1864</title>
</head>
<body>
<p style="text-indent: 0;">nicht anerkennen)<a id="A437"></a> und dazu den Dronke hier gehabt. Jetzt ist es beinah 7 Uhr und ich hab' noch kein dinner im Leib, bin auch noch nicht fertig. Du siehst, wie es geht.</p>
<p>Viele Grüße.</p>
<p align="right">Dein<br><i>F. E.</i></p>
