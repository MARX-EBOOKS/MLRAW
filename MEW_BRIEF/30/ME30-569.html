<title>50 · Marx an Ferdinand Lassalle · 2. Oktober 1860</title>
</head>
<body>
<p>Das Obertribunal hat noch nicht entschieden. Sobald die Sache fertig und ich nicht zu öffentlicher Verhandlung zugelassen werde, publiziere ich hier einen Druckbogen (Pamphlet): „<i>Prussian Justice</i>“.<a id="A137"></a></p>
