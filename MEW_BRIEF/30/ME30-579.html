<title>58 · Marx an Ferdinand Lassalle · 16. Januar 1861</title>
</head>
<body>
<p>Mierosławski, der eben in Paris war, erklärte meinem Freunde Schily, daß die Sachen „schlecht“ stünden. Sprach sich dabei sehr ungünstig über „Klapka“ aus. Doch bin ich selbst über M[ierosławski] nicht im klaren.</p>
