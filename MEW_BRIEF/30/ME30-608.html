<title>73 · Marx an Ferdinand Lassalle · 11. Juni 1861</title>
</head>
<body>
<p>Obgleich oder wenn auch ich nicht das Indigenat<sup><a id="ZF5" href="#F5">5</a></sup> erhalte, so ist immer noch fraglich, ob ich für den Winter auf <i>meinen Paß</i> hin nicht mit family nach Berlin komme als „Fremder“.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F5" href="#ZF5">5</a> die Staatsangehörigkeit</p>
</aside>
