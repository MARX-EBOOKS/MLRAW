<title>97 · Marx an Lion Philips · 29. März 1864</title>
</head>
<body>
<p>wird, das Papier zu Ende geht und Postschluß vor der Türe steht, muß ich für diesmal schließen mit den besten Grüßen der ganzen Familie. Ditto an Karl<sup><a id="ZF16" href="#F16">16</a></sup> und Gattin, Jean enz<sup><a id="ZF17" href="#F17">17</a></sup>.</p>
<p align="right">Dein treuer Neffe<br>
<i>K. Marx</i></p>
<aside>
<p><a id="F16" href="#ZF16">16</a> Karl Philips</p>
<p><a id="F17" href="#ZF17">17</a> Jean Philips nicht ausgenommen</p>
</aside>
</body>
