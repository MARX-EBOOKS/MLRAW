<title>14 · Marx an Engels · 10. Dezember 1864</title>

<body>
<p>Art gemacht werden würden, hatte ich jedoch glücklicherweise schon das by-law<sup><a id="ZF39" href="#F39">39</a></sup> durchgesetzt, daß niemand (außer Arbeiter<i>societies</i>) <i>invitirt</i> werden dürfe, und daß kein Mensch <i>Ehrenmitglied</i> sein könne.<a id="A53"></a></p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
