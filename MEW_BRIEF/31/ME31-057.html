<title>21 · Engels an Marx · 5. Februar 1865</title>
</head>
<body>
<p>Meinen Schwager suchte ich über Siebel<sup><a id="ZF1" href="#F1">12</a></sup> auszuspumpen, konnte aber nichts erfahren, als daß er „immer besoffen“ sei, mit Schauspielerinnen herumliefe und seine Frau sich von ihm scheiden lassen wolle.</p>
<p>My best compliments to the ladies.</p>
<aside>
<p><a id="F1" href="#ZF1">12</a> Karl Emil Blank</p>
</aside>
</body>
