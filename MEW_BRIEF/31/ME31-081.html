<h1 align="center">34<br>Marx an Engels<br>in Manchester</h1>
<p align="right">[London, vor dem 22. Februar 1865]</p>
<p>Lieber Frederick,</p>
<p>Einliegend zum Sonntags<i>vergnügen</i> und pour la bonne bouche<sup><a id="ZF1" href="#F1">1</a></sup> geheime Beiträge zur <i>crème bonapartiste</i>.<a id="A109"></a></p>
<p>Du mußt die Zettel aufheben. My compliments to Mrs. Lizzie.</p>
<p align="right">Dein<br><i>K. M.</i></p>
<aside>
<p><a id="F1" href="#ZF1">1</a> als Leckerbissen</p>
</aside>
</body>
