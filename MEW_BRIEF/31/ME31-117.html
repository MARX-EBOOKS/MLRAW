<p>des Gesetzes wegen nicht mit Paris, sondern direkt mit London in Verbindung.</p>
<p>Mein Buch<sup><a id="ZF36" href="#F36">36</a></sup> wird hoffentlich (trotz vieler Unterbrechungen) bis 1. September fix und fertig sein. Es geht gut voran, obgleich ich immer noch nicht ganz ausgeheilt.</p>
<p align="right">Dein<br><i>K. M.</i></p>
