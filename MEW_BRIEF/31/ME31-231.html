<title>116 · Engels an Marx · 4. Juli 1866</title>
</head>
<body>
<p>Die einzige Deckung gegen den Verrat, den Bism[arck] mit Bonaparte eingefädelt hat, ist die ganz unerwartete Größe der Erfolge. Es wird ihm da schwer werden, viel abzutreten, und die Belgier werden wohl etwas herhalten müssen.<a id="A275"></a></p>
<p>Beste Grüße an die ladies.</p>
<p align="right">Dein<br><i>F. E.</i></p>
</body>
