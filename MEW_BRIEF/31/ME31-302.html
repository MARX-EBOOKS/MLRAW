<p>Mit wahrem Vergnügen aus der Pariser Korrespondenz der „<i>Times</i>“ die polenfreundlichen Exklamationen der Pariser <i>wider</i> Alex[ander] etc. ersehn.<a id="A243"></a> Herr Proudhon und seine kleine doktrinäre Clique sind nicht das French People<sup><a id="ZF10" href="#F10">10</a></sup>.</p>
