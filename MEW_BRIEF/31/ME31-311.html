<title>157 · Engels an Marx · 26. Juni 1867</title>
</head>
<body>
<p>Nachdem ich Lizzie von Hamburg wieder nach Grimsby geschickt, werde ich auch Meißner und Kugelmann besuchen und dann an den Rhein gehn.</p>
<p>Beste Grüße.</p>
<p align="right">Dein<br><i>F. E.</i></p>
</body>
