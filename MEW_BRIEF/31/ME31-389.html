<title>202 · Engels an Marx · 26. November 1867</title>
</head>
<body>
<p>Wie ist's mit dem Karbunkel? Die Position gefällt mir nicht, hoffentlich hat Lafargue Dir ihn geschnitten. Dieser Geschichte muß nun doch ein Ende gemacht werden.</p>
<p>Hat Borkh[eim] Dir das Geld bezahlt? Mir schreibt er nichts, obwohl ich Garant bin.<sup><a id="ZF8" href="#F8">8</a></sup></p>
<p align="right">Dein<br><i>F. E.</i></p>
<aside>
<p><a id="F8" href="#ZF8">8</a> siehe vorl. Band, S. 355 und 358</p>
</aside>
