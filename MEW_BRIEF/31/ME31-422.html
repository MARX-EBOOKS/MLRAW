<title>3 · Engels an Hermann Engels · 2. November 1864</title>
</head>
<body>
<p>Grüße Emma, die Kleinen, Rudolfs, Blanks und Boellings, und wenn Du nach Engelskirchen schreibst, auch die Mutter und die Dortigen. Die mit dem Fallen der Preise verknüpften Schikanen haben mir viel Schererei gemacht.</p>
<p align="right">Dein<br><i>Friedrich</i></p>
</body>
