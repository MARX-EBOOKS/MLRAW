<title>12 · Marx an Hermann Jung · um den 8. Januar 1865</title>
</head>
<body>
<p>Ich wäre Ihnen verbunden, wenn Sie mich unter der obigen Adresse wissen ließen – vorausgesetzt, daß Sie Einspruch erheben – welche Antwort Ihnen zuteil wurde.<a id="A487"></a></p>
<p>Salut et fraternité.<sup><a id="ZF2" href="#F2">2</a></sup></p>
<p align="right"><i>K. Marx</i></p>
<p>Aus dem Englischen.</p>

<aside>
<p><a id="F2" href="#ZF2">2</a> Gruß und Brüderlichkeit.</p>
</aside>
