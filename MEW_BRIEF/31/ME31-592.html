<title>6 · Jenny Marx an Ludwig Kugelmann · 1. April 1866</title>
</head>
<body>
<p>leicht Spaß macht, von dem Mann, dem Sie, ohne ihn persönlich zu kennen, so viel Freundschaft bezeugen, ein Sonnenbild zu besitzen, so lege ich diesem Blättchen 1 Copy bei.</p>
<p>Mich Ihnen unbekannterweise empfehlend bin ich</p>
<p align="right">Ihre ergebene<br><i>Jenny Marx</i></p>
</body>
