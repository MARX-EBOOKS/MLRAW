<p style="text-indent: 0;">in Brüssel, und jeder sh., den wir auftreiben können, wird jetzt benutzt, ein member more<sup><a id="ZF5" href="#F5">5</a></sup> dahin zu schicken. Tuesday next is our last sitting<sup><a id="ZF6" href="#F6">6</a></sup> in diesem Jahr vor dem Kongreß.<a id="A173"></a></p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F5" href="#ZF5">5</a> Mitglied (des Generalrats) mehr</p>
<p><a id="F6" href="#ZF6">6</a> Nächsten Dienstag ist unsere letzte Sitzung</p>
</aside>
