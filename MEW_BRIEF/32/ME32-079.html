<title>40 · Marx an Engels · 4. Mai 1868</title>
</head>
<body>
<p>Sehr hübsch, daß Deine vaterländische Handelskammer über die wachsende Macht und Gefährlichkeit der Internationalen Arbeiterassoziation jammert.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
