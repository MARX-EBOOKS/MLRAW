<p style="text-indent: 0;">nightly Review") in Schottland, woher wir noch keine weiteren news<sup><a id="ZF5" href="#F5">5</a></sup> erhalten haben.<a id="A16"></a></p>
<p>Wie lebt Ihr bei der Hitze? Mir vergeht alles Denkvermögen dabei, und ohne Gumperts Medizin I could not stand it at all<sup><a id="ZF6" href="#F6">6</a></sup>.</p>
<p>Salut.</p>
<p align="right">Dein<br><b><i>K.M.</i></b></p>
