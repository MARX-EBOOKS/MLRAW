<title>120 · Engels an Marx · 18. November 1868</title>
</head>
<body>
<p>Das Geheul der liberalen Bourgeois würde mich sehr amüsieren, wenn diese Nebenerfahrung nicht wäre. Um mich recht zu erheitern, hab' ich gestern dem Borchardt seinen Schwiegersohn, der pflichtschuldigst für die Liberalen geschanzt hatte, kartaunenbesoffen gemacht.</p>
<p align="right">Dein<br><i>F. E.</i></p>
