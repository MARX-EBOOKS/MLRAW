<title>121: Engels an Marx · 20. November 1868</title>
</head>
<body>
<p style="text-indent: 0;">nicht von Samstagabend bis Montagmorgen in den Händen der Post für sicher halten.</p>
<p>Viele Grüße.</p>
<p align="right">Dein<br><i>F. E.</i></p>
<p>Schick mir den Brief von Schaute<sup><a id="ZF3" href="#F3">3</a></sup> zurück<a id="A235"></a>, ich muß ihm doch nachweisen, was er für Sprachschnitzer macht.</p>
<aside>
<p><a id="F3" href="#ZF3">3</a> Sigismund Borkheim</p>
</aside>
