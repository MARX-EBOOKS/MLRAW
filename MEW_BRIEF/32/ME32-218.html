<title>126 · Marx an Engels · 30. November 1868</title>
</head>
<body>
<p>Aber sunt certi denique fines<sup><a id="ZF09" href="#F09">9</a></sup>. Es ist natürlich unpleasant<sup><a id="ZF10" href="#F10">10</a></sup>, Dir das zu schreiben. Sagen läßt sich so was schon eher. Doch ist es nötig, um Dir zu erklären, warum ich Jennychens Schritt nicht absolut rückgängig machte.</p>
<p align="right">Dein</p>
<p align="right"><i>K.M.</i></p>
<aside>
<p><a id="F09" href="#ZF09">9</a> es gibt schließlich doch gewisse Grenzen</p>
<p><a id="F10" href="#ZF10">10</a> unangenehm</p>
</aside>
</body>
</html>
