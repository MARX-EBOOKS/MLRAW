<h1>139<br>Marx an Engels<br>in Manchester</h1>
<p align="right">[London] 23. Dez. 1868</p>
<p style="text-indent: 0;">Dear Fred,</p>
<p>Ich zeige Dir – da ich gleich zur City – nur den Empfang Deines brillanten Christmasgeschenks an. Du kannst Dir denken, welcher Jubel im Haus war.</p>
<p style="text-indent: 0;">Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
