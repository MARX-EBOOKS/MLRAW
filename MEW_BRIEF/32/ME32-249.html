<h1>146<br>Engels an Marx<br>in London<a id="A63"></a></h1>
<p align="right">Manchester, 7, Southgate,<br>26. Jan. 1869.</p>
<p>Lieber Mohr,</p>
<p>Heute mittag 2 Uhr ist Ernest Jones an der Lungenentzündung gestorben. Er war seit Donnerstag krank und seit Freitag von den Ärzten aufgegeben.</p>
<p><b>Das ist wieder einer von den Alten!</b></p>
<p align="right">Dein <b>F. E.</b></p>
