<title>154: Marx an Engels : 24. Februar 1869</title>
</head>
<body>
<p>Wilhelm bleibt unveränderlich derselbige. Von den 50 oder 60 Exemplaren<sup><a id="ZF09" href="#F09">(9)</a></sup>, die er mir schrieb an Kugelmann geschickt zu haben<a id="A288"></a>, hat Kugelmann in der Tat erhalten 6 ganze Stück!<a id="A295"></a></p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
