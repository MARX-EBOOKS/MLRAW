<title>154 · Marx an Engels · 24. Februar 1869</title>
</head>
<body>
<p>Wilhelm bleibt unveränderlich derselbige. Von den 50 oder 60 Exemplaren<sup><a id="ZF9" href="#F9">9</a></sup>, die er mir schrieb an Kugelmann geschickt zu haben<a id="A288"></a>, hat Kugelmann in der Tat erhalten 6 ganze Stück!<a id="A295"></a></p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
<aside>
<p><a id="F9" href="#ZF9">9</a> Karl Marx: „Herr Vogt".</p>
</aside>
</body>
