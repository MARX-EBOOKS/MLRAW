<title>213 · Marx an Engels · 4. August 1869</title>
</head>
<body>
<p>Wenn ich nur irgendwo Leute sitzen sähe, die uns nicht in Eseleien hereinreiten, so würde ich mit dem größten Vergnügen den Zentralrat von hier entfernt sehn. Die Sache wird ennuyant<sup><a id="ZF7" href="#F7">7</a></sup>.</p>
<p>Salut.</p>
<p align="right">El<br><i>Moro</i></p>
<p><b>Beesly verheiratet 24 July.</b></p>
<aside>
<p><a id="F7" href="#ZF7">7</a> langweilig</p>
</aside>
