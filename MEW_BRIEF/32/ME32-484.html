<p>bringen, was könnte der Generalrat machen? Der einzige faßbare Punkt ist der der absoluten Teetotalabstinenz<sup><a id="ZF3" href="#F3">(3)</a></sup> von aller Politik, aber auch diese Handhabe wäre nicht so sicher.</p>
<p>Die Herren Genfer hätten auch ihren <i>Gott</i> im Sack behalten können.<a id="A569"></a></p>
<p align="right">Dein</p>
<p align="right"><i>F. E.</i></p>
