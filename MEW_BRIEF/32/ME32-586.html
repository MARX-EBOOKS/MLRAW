<title>32 · Engels an Hermann Engels · 18. Dezember 1868</title>
</head>
<body>
<p>Inl. ein Haufen Photographien, wovon Ihr 2 nach Engelskirchen schicken und die übrigen dort verteilen könnt. Für die Mutter ist von jeder Sorte eines bestimmt.</p>
<p>Grüß die Mutter, Deine Frau und alle Geschwister herzlich und amüsiert Euch gut an den Feiertagen.</p>
<p>Mit bestem Gruß</p>
<p align="right">Dein</p>
<p align="right"><i>Friedrich</i></p>
</body>
