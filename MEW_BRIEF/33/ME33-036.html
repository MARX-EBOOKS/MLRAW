<title>12 · Engels an Marx · 10. August 1870</title>
</head>
<body>
<p>Wegen dem Haus noch immer nichts gehört.<sup><a id="ZF6" href="#F6">6</a></sup> Unter den Umständen wäre es vielleicht doch besser, sich nicht auf 3<sup>1</sup>⁄<sub>2</sub> Jahr zu binden; ich warte noch ein paar Tage, bis ich dem Kerl<sup><a id="ZF7" href="#F7">7</a></sup> schreibe.</p>
<aside>
<p><a id="F6" href="#ZF6">6</a> siehe vorl. Band, S. 14 und 17</p>
<p><a id="F7" href="#ZF7">7</a> Smith</p>
</aside>
</body>
