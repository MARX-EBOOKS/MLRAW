<title>32 · Engels an Marx · 23. August 1871</title>
</head>
<body>
<p>Ich bin überlaufen von morgens bis abends, kann nicht mal eine Zeitung lesen, habe unten auch jetzt wieder jemand sitzen. Dazu sind mir meine Brüder<sup><a id="ZF3" href="#F3">3</a></sup> angesagt.</p>
<p>Salut.</p>
<p align="right">Dein<br><i>F. E.</i></p>
<aside>
<p><a id="F3" href="#ZF3">3</a> Hermann und Rudolf Engels</p>
</aside>
