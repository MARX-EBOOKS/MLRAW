<h1>7<br>Marx an Eugen Oswald<br>in London<a id="A168"></a></h1>
<p align="right">London, 5.August 1870</p>
<p style="margin-left: 2em;">Lieber Oswald,</p>
<p style="margin-left: 2em;">Schicken Sie gefälligst Ihre Adresse<a id="A16"></a> zur Ansicht an meinen Freund L.S.Borkheim, an seine Privatadresse: 10, Brunswick Gardens, Kensington, W.</p>
<p style="margin-left: 2em;">Meinen besten Gruß an die Damen.</p>
<p align="right">Ihr<br><i>Karl Marx</i></p>
