<title>31 · Marx an Sigfrid Meyer · 21. Januar 1871</title>
</head>
<body>
<p>Sie und Vogt schulden mir Ihre Photogramme. Ich glaube wenigstens, daß sie mir versprochen wurden.</p>
<p>Salut an Sie und Vogt.</p>
<p align="right">Ihr<br><i>Karl Marx</i></p>
<p>Wegen der public lands<sup><a id="ZF14" href="#F14">14</a></sup> habe ich an meinen alten Freund G. J. Harney geschrieben<a id="A11"></a>, der jetzt Untersekretär des Staats Massachusetts.</p>
