<title>45 · Marx an Wilhelm Liebknecht · um den 10. April 1871</title>
</head>
<body>
<p style="text-indent: 0;">einer der einflußreichsten Chefs der <i>Internationalen</i>, im Jahr 1857 <i>der Privatsekretär des Grafen Bismarck</i> war und niemals aufgehört hat, in Beziehungen zu seinem ehmaligen <i>Patron</i> zu stehn.“</p>
<p>Der Stieber wird wirklich „fürchterlich“!</p>
<p>Salut.</p>
<p align="right">Dein<br><i>K.M.</i></p>
