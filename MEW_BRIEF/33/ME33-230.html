<title>61 · Marx an Edward Spencer Beesly · 12. Juni 1871</title>
</head>
<body>
<p>für vier bis fünf Bogen wurde in zwei Bogen gedruckt. Daraus entstanden zahlreiche Korrekturen, Revisionen und Druckfehler. Deshalb auch die Verzögerung.</p>
<p align="right">Ihr treuer<br><i>Karl Marx</i></p>
<p>Nach: „Vorwärts“, Berliner Volksblatt,<br>vom 31. März 1909, 1. Beilage.</p>
