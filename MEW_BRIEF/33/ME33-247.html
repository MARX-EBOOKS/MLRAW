<title>70 · Marx an A.O.Rutson · 12. Juli 1871</title>
</head>
<body>
<p>Die Adresse „Herr Washburne, der amerikanische Gesandte“, die gerade im Druck ist, sende ich Ihnen morgen.</p>
<p align="right">Ihr ergebener<br><i>Karl Marx</i></p>
<p style="text-indent: 0;">A.O.Rutson, Esq. 7, Halfmoon Street, W.</p>
<p>PS. Ich füge eine handschriftliche Kopie der Adresse an Abraham Lincoln und seine Antwort<a id="A286"></a> bei.</p>
<p>Aus dem Englischen.</p>
</body>
