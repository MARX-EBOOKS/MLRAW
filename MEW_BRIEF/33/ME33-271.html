<p>Grüßen Sie Sorge von mir. Ich werde nächste Woche auf seinen Brief antworten.<sup><a id="ZF2" href="#F2">2</a></sup></p>
<p align="right">Ihr ergebener<br><i>Karl Marx</i></p>
<p style="text-indent: 0;">Nach: „Briefe und Auszüge aus Briefen<br>von Joh. Phil. Becker, Jos. Dietzgen,<br>Friedrich Engels, Karl Marx u. A.<br>an F.A. Sorge und Andere“,<br>Stuttgart 1906.</p>
