<title>100 · Marx an Gustav Kwasniewski · 29. September 1871</title>
</head>
<body>
<p>Als Mitglied der Kontrollkommission der Sozialdemokratischen Arbeiterpartei wird es Ihnen vielleicht persönlich möglich sein, in dieser Richtung zu wirken.</p>
<p align="right">Ihr freundschaftlichst ergebener<br><i>Karl Marx</i></p>
<p>Nach einer handgeschriebenen Abschrift.</p>
