<h1>124<br>Marx an Jules Johannard<br>in London<a id="A836"></a></h1>
<p align="right">London, 18.Nov. 1871</p>
<p style="text-indent: 2em;">Mein lieber Jules Johannard,</p>
<p style="text-indent: 2em;">Man erwartet Sie bei mir morgen abend (Sonntag) zwischen 7 und 8 Uhr. Zuerst werden einige internationale Angelegenheiten beraten. Später absolute Freiheit!</p>
<p align="right">Ganz der Ihre<br><i>Karl Marx</i></p>
<p>Aus dem Französischen.</p>
