<title>183 · Engels an Wilhelm Liebknecht · 15.–22. Mai 1872</title>
</head>
<body>
<p>Quittung an Fink nächstens zurück.</p>
<p>Notabene. Es wäre vielleicht gut, wenn es anginge, mir Korrektur vom Artikel zu schicken, doch ich überlasse Dir das. Wesentliche Bedingung meiner Mitarbeiterschaft ist aber 1. Abwesenheit aller Randglossen und 2. Abdruck in <i>großen</i> Abschnitten.</p>
