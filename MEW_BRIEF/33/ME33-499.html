<p style="text-indent: 0;">händig die geheimen Instruktionen aufgesetzt und nach Spanien geschickt hat, nach denen die Internationale dort geleitet werden soll!</p>
<p>Inl. Brief kam heute an.</p>
<p>Grüßen Sie Herman bestens, ist er wieder ganz gesund?</p>
<p align="right">Ihr</p>
<p align="right"><i>F. E.</i></p>
