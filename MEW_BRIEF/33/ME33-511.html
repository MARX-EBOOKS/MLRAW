<title>205 · Engels an Theodor Cuno · 4. August 1872</title>
</head>
<body>
<p>Sagen Sie Herman, ich habe mich für Arbeit für ihn umgetan, kann aber bis jetzt nichts aufreiben. Zu Jackson &amp; Sons zu gehn, hat keinen Zweck, nach meiner letzten Erfahrung dort im Februar. Sagen Sie H[erman], er soll an seinen Freund Prigneaux hier schreiben, das ist der Mann.</p>
