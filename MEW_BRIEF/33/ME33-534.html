<p>setzen. Nächster Steamer<sup><a id="ZF2" href="#F2">2</a></sup> bringt wieder einige Nrn. Es ist neben dem „Volksst[aat]“ unser bestes Blatt.</p>
<p>Die Geschichte mit West hat uns königlich amüsiert.</p>
<p>Wir alle grüßen Sorge und Dich herzlich.</p>
<p align="right">Dein<br><i>F. Engels</i></p>
<p>Lafargue und Frau sind vorgestern hier angekommen.</p>
