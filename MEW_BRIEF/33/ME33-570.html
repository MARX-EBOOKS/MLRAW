<h1>237 · Engels an Natalie Liebknecht · 11. März 1873</h1>
<p>Wenn unter den Kindern sich einige noch meiner erinnern sollten, was ich aber sehr bezweifle, da ich damals nicht in London wohnte, so wollen Sie sie herzlichst von mir grüßen.</p>
<p>Mit aufrichtigster Teilnahme</p>
<p align="right">Ihr ergebner</p>
<p align="right"><i>Friedrich Engels</i></p>
