<title>239 · Engels an Friedrich Adolph Sorge · 20. März 1873</title>
</head>
<body>
<p>Hier ist sonst nichts Neues. Die Jung-Halesschen Schimpfereien gehn durch die ganze jurassische, belgische und sonstige sezessionistische Presse; Longuet will in der „Liberté“ darauf antworten, ob's was wird, ist mir bei seiner Faulheit nicht ganz klar.</p>
<p>Postschluß.</p>
<p>Besten Gruß.</p>
<p align="right">Dein</p>
<p align="right"><i>F. Engels</i></p>
</body>
