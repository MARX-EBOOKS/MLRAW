<title>13 · Engels an Marx · 2. März 1877</title>
</head>
<body>
<p>seine Leistungen in der Züchtung von Fischen und Amphibien sich einen wirklich wissenschaftlichen Rang erobert, man wagen konnte, die Karikatur in Westminster, music hall mit Fischbegleitung, und noch dazu unter solchem puffing<sup><a id="ZF5" href="#F5">5</a></sup> ins Dasein zu rufen.</p>
<p>Besten Gruß.</p>
<p align="right">Dein</p>
<p align="right"><i>F. E.</i></p>
