<title>24 · Engels an Marx · 24. Juli 1877</title>
</head>
<body>
<p style="text-indent: 0;">englischen Truppensendungen werden wohl hinreichen, um einen Sultans<sup><a id="ZF5" href="#F5">5</a></sup>-Separatfrieden zu verhindern, und das ist das Gute dabei.</p>
<p>Mit Lizzie geht's besser. Sie hatte am Sonntag eine ernsthafte Krisis und scheint sich jetzt allmählich zu erholen.</p>
<p>Beste Grüße an alle.</p>
<p align="right">Dein</p>
<p align="right"><i>F. E.</i></p>
<aside>
<p><a id="F5" href="#ZF5">5</a> Abdul Hamid II.</p>
