<title>6 · Marx an Pjotr Lawrowitsch Lawrow · 11. Februar 1875</title>
</head>
<body>
<p style="text-indent: 0;">meiner Ankunft in London eine <i>cold</i><sup><a id="ZF3" href="#F3">(3)</a></sup> zugezogen, die mir immer noch zu schaffen macht.</p>
<p>Ich werde Sie besuchen, wenn das Wetter schöner ist.</p>
<p align="right">Ganz der Ihre<br><i>Karl Marx</i></p>
<p style="text-indent: 0;">Aus dem Französischen.</p>
