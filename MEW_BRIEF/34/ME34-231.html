<title>Engels an Gustav Rasch · Ende November 1876</title>

<p style="text-indent: 0;">erklärte, er habe Sie gar nicht gesehn und also diese Unterhaltungen gar nicht führen können.<a id="A337"></a></p>
<p style="text-indent: 2em;">Ich konnte nicht früher antworten, da mein Ex. von Marx' „Herr Vogt“, wo das Obige S. 55 und folgende zu lesen<a id="A338"></a>, verpumpt war und ich es erst gestern zurückerhielt.</p>
<p style="text-indent: 2em;">Freundlichen Gruß.</p>
<p align="right">Ihr</p>
<p align="right"><i>F. E.</i></p>
