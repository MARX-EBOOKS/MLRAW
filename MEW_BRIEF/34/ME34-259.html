<title>91 · Engels an Johann Philipp Becker · 24. März 1877</title>
</head>
<body>
<p>Dein Fragment in der „<i>Neuen Welt</i>“<a id="A362"></a> hat mich sehr amüsiert, Du solltest es fortsetzen, es ist dem jungen Volk gut, wenn sie an die alten Bewegungen erinnert werden, sie meinen sonst, sie wären niemandem was schuldig als sich selbst.</p>
<p align="right">Dein alter</p>
<p align="right"><i>F. Engels</i></p>
