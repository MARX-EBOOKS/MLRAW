<title>Engels an Laura Lafargue · 3. September 1880</title>
</head>
<body>
<p style="text-indent: 1.5em;">angeln, von denen es hier vortreffliche Exemplare gibt; Du weißt doch, der <i>Backfisch</i> lebt auf dem Trockenen. Bevor sie gingen, ließen sie Euch aber beide herzlich grüßen.</p>
<p align="right">In Zuneigung Dein<br><i>F. Engels</i></p>
<p>Aus dem Englischen.</p>
