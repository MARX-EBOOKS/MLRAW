<h1>216<br>Marx an Carl Hirsch<br>in London<a id="A576"></a></h1>
<p align="right">[London] 29. Dez. 1880</p>
<p>Lieber Hirsch,</p>
<p>Sei so gut, Dich einzufinden nächsten Freitag abend (<i>7 Uhr</i>) zu Dinner und Feier des Neujahrs.</p>
<p>Salut.</p>
<p align="right"><i>K.M.</i></p>
