<h1>4<br>Mitteilung Friedrich Engels'<br>über den Tod seiner Frau</h1>
<p>Meinen Freunden in Deutschland zeige ich hiermit an, daß meine Frau, Lydia, geb. Burns, mir in der verflossenen Nacht durch den Tod entrissen wurde.</p>
<p>London, 12.September 1878</p>
<p align="right"><i>Friedrich Engels</i></p>
<p>Nach: „Vorwärts“, Nr.110<br>vom 18.September 1878.</p>
