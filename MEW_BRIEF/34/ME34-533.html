<title>8 · Jenny Longuet an Charles Longuet · 31. Oktober 1880</title>
</head>
<body>
<p>Die Artikel von Roy habe ich nicht gelesen. Papa ist der Ansicht, daß der zweite alles übertrifft, was bis jetzt über Littré veröffentlicht worden ist. Grüße und Küsse von allen.</p>
<p align="right">Deine<br><i>Jenny</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
