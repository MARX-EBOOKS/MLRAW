<title>1 · Engels an Marx · 7. Juli 1881</title>
</head>
<body>
<p>wieder hier. Wir werden wohl bald nach Bridlington Quay<a id="A3"></a> gehn und später, wenn Sch[orlemmer] von Deutschland zurück, mit diesem nach Jersey; wenigstens sind das bis jetzt die Entwürfe.</p>
<p>Beste Grüße von uns allen an Deine Frau und Dich.</p>
<p align="right">Dein<br><i>F. E.</i></p>
