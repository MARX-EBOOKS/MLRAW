<title>3 · Engels an Marx · 29. Juli 1881</title>
</head>
<body>
<p>Schreibe bald wieder, wie es geht.</p>
<p>Herzliche Grüße von uns allen an Deine Frau und Jenny. Pumps läßt noch besonders Johnny grüßen, ditto ich. Grüß auch Longuet.</p>
<p align="right">Dein<br><i>F. E.</i></p>
