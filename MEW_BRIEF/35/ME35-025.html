<title>10 · Engels an Marx · 18.August 1881</title>
</head>
<body>
<p>Die Sache hat mich so erfaßt, daß sie mir nicht nur den ganzen Tag im Kopf herumgeht, sondern ich auch vorige Nacht im Traum einem Kerl meine Hemdsknöpfe zum Differenzieren gab und dieser mir damit durchbrannte.</p>
<p align="right">Dein</p>
<p align="right"><i>F. E.</i></p>
</body>
