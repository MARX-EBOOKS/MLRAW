<title>45 · Engels an Marx · 12.September 1882</title>
</head>
<body>
<p>dauern wird. Ihr Kleines<sup><a id="ZF7" href="#F7">7</a></sup> hat sich in Yarmouth merkwürdig herausgemacht. Johnny geht seit gestern in die Kleinkinderschule (in Grafton Terrace, Eurem alten Haus gegenüber).</p>
<p>Herzliche Grüße von allen an Dich und Laura.</p>
<p align="right">Dein<br><i>&nbsp;&nbsp;&nbsp;&nbsp;F. E.</i></p>
<aside>
<p><a id="F7" href="#ZF7">7</a> Lilian Rosher</p>
