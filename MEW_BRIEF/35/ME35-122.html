<title>62 · Engels an Marx · 30. November 1882</title>

<p>H[artmann] diverses ausstellen. Er und sein Finanzmann, den ihm Percy<sup><a id="ZF4" href="#F4">4</a></sup> gefunden, sind sehr begeistert für die Erfindung.</p>
<p>Hier alles wohl.</p>
<p align="right">Dein</p>
<p align="right"><i>F. E.</i></p>
<aside>
<p><a id="F4" href="#ZF4">4</a> Percy Rosher</p>
