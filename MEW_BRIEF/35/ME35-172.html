<title>10 · Engels an Eduard Bernstein · 12. März 1881</title>
</head>
<body>
<p>Irland bewirkt das alles, Irland ist das treibende Element im Reich. Dies zu Ihrer Privat-Information. Nächstens mehr darüber.</p>
<p>Gruß.</p>
<p align="right">Ihr<br><i>F. E.</i></p>
<p>Da Kautsky, den Sie grüßen wollen, doch bald herkommt, wäre es zwecklos, ihm ausführlich zu antworten. Grüßen Sie Beust, wenn Sie ihn sehn.</p>
</body>
