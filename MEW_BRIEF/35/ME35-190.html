<title>18 · Engels an Jenny Longuet · 31. Mai 1881</title>
</head>
<body>
<p>Freundliche Grüße an Longuet. Pumps sendet ihre herzlichsten Grüße, und ich schließe mich ihr an.</p>
<p>In Zuneigung</p>
<p align="right">Dein<br><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
