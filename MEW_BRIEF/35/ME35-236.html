<title>41 · Engels an Johann Philipp Becker · 4. November 1881</title>
</head>
<body>
<p>ganz enorm gewesen. Wieviel Sitze wir erhalten, ist Wurst. Immer genug, um das Nötige im Reichstag zu sagen. Aber das Faktum, daß wir in den großen Städten Grund gewonnen haben, statt ihn zu verlieren – das ist brillant und Hurra für unsre Jungens in Deutschland!</p>
<p align="right">Dein alter</p>
<p align="right"><i>F. E.</i></p>
