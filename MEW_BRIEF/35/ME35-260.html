<title>53 · Engels an Emil Engels · 12. Januar 1882</title>
</head>
<body>
<p>hier ist es heut wieder so warm, daß ich den Überrock trotz etwas Scotch mist<sup><a id="ZF2" href="#F2">2</a></sup> nicht anbehalten konnte.</p>
<p>Beste Grüße an Euch alle, Lottchen und das Brautpaar besonders.</p>
<p align="right">Dein</p>
<p align="right"><i>Friedrich</i></p>
<p>Es wird mich freuen, Emil<sup><a id="ZF3" href="#F3">3</a></sup> hier zu sehn.</p>
<aside>
<p><a id="F2" href="#ZF2">2</a> dichten, feuchten Nebels</p>
<p><a id="F3" href="#ZF3">3</a> Emil Engels jun.</p>
</aside>
</body>
