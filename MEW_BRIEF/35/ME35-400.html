<title>111 · Engels an Karl Kautsky · 15. November 1882</title>
</head>
<body>
<p>noch mir dienen können. Bei der vorgerückten Zeit kann ich Ihnen sonst nur noch für die verschiednen interessanten Mitteilungen über die dortige Lage danken und zum Schluß Ihnen zu Ihrer Verlobung<sup><a id="ZF4" href="#F4">4</a></sup> meinen herzlichsten Glückwunsch darbringen.</p>
<p align="right">Aufrichtigst Ihr</p>
<p align="right"><i>F. E.</i></p>
<aside>
<p><a id="F4" href="#ZF4">4</a> mit Louise Strasser</p>
</aside>
</body>
