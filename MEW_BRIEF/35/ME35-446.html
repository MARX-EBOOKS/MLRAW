<title>129 · Engels an Eduard Bernstein · 27. Februar–1. März 1883</title>
</head>
<body>
<p>gemacht (er selbst schrieb mir fast nie!), in der „S[üddeutschen] P[ost]“ schmählich versaubert, aber das konnte ich M[arx] natürlich verbergen, sonst hätte er mir die Haare ausgerissen. Auch dazu hatte V[iereck] keine Erlaubnis von mir.</p>
