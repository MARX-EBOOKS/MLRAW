<title>138 · Engels an Friedrich Adolph Sorge · 15. März 1883</title>
</head>
<body>
<p>sicher, aber die Umwege, die temporären und lokalen Verirrungen – schon so unvermeidlich – werden jetzt ganz anders anwachsen. Nun – wir müssen’s durchfressen, wozu anders sind wir da? Und die Courage verlieren wir darum noch lange nicht.</p>
<p align="right">Dein</p>
<p align="right"><i>F. Engels</i></p>
