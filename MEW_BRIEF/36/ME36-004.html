<title>1 · Engels an Pjotr Lawrowitsch Lawrow · 2. April 1883</title>
</head>
<body>
<p>zurückgekehrt ist.<a id="A3"></a> Hoffentlich hat er, der die Tapferkeit bewahrt hat, die Torheit in Rußland zurückgelassen. Ich hoffe, ihn dieser Tage hier zu sehen. Grüßen Sie ihn herzlich von mir.</p>
<p align="right">Freundschaftlichst Ihr</p>
<p align="right"><i>F. Engels</i></p>
<p><i>Aus dem Französischen.</i></p>
</body>
