<title>3 · Engels an Ferdinand Domela Nieuwenhuis · 11.April 1883</title>
</head>
<body>
<p>Entschuldigen Sie, dat ik niet op hollandsch schrijf, ich habe in den letzten Jahren keine Übung mehr in Ihrer Sprache gehabt.</p>
<p align="right">Aufrichtigst Ihr<br><i>F. Engels</i></p>
<p>Meine Photographie liegt bei, ich bitte um die Ihrige. Sobald wir neue von M[arx] bekommen, schicke ich Ihnen eine.</p>
</body>
