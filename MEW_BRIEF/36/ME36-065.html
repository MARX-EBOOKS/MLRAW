<title>34 · Engels an Laura Lafargue · 3. Oktober 1883</title>
</head>
<body>
<p>Damit schließe ich. Obwohl ich mich wesentlich besser fühle, muß ich auf Anordnung noch einige Tage möglichst ruhig liegen, und so verbleibe ich mit den besten Grüßen an die Gefangenen<a id="A6"></a> und mit herzlichen Grüßen von Nim und mir</p>
<p align="right">in Zuneigung stets Dein<br><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
