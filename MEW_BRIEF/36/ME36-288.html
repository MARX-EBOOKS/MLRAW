<title>154 · Engels an Laura Lafargue · 8. März 1885</title>
</head>
<body>
<p>Was macht die Montceau-Brenin-Thévenin-Affäre?<a id="A390"></a> Und hat der „Cri du P[euple]" seinen letzten Schrei getan?</p>
<p>Amitiés à Paul.<sup><a id="ZF7" href="#F7">7</a></sup></p>
<p align="right">In Zuneigung Dein<br><i>F. Engels</i></p>
<p><b>Nim läßt grüßen!</b></p>
<p style="text-indent: 0;"><b>Aus dem Englischen.</b></p>
<aside>
<p><a id="F7" href="#ZF7">7</a> Grüße an Paul.</p>
</aside>
