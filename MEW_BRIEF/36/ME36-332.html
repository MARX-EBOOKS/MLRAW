<title>175 · Engels an Laura Lafargue · 16. Juni 1885</title>
</head>
<body>
<p style="text-indent: 0;">Pumps und ihre Kinder sind wohl auf. Percy hat die üblichen Streitigkeiten mit seinen Eltern. Den Scheck über £ 10 füge ich bei. Und hiermit – ce – verbleibe ich</p>
<p align="right">in Zuneigung Dein alter<br><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
