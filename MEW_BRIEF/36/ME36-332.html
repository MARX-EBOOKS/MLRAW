<title>175 · Engels an Laura Lafargue · 16. Juni 1885</title>
</head>
<body>
<p>Pumps und ihre Kinder sind wohlauf. Percy hat die üblichen Streitigkeiten mit seinen Eltern. Den Scheck über £ 10 füge ich bei. Und hiermit – sur ce – verbleibe ich</p>
<p align="right">in Zuneigung Dein alter<br><i>F. Engels</i></p>
<p>Aus dem Englischen.</p>
</body>
