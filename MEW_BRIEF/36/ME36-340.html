<title>179 · Engels an Laura Lafargue · 4. Juli 1885</title>
</head>
<body>
<p>Von der russischen Übersetzung des 2. Bandes sind von 33 Bogen 18 bereits fertig.<a id="A422"></a></p>
<p>Jetzt muß ich in dringenden Privatangelegenheiten (Geld) in die Stadt gehen, darum für heute nichts mehr von Deinem</p>
<p align="right">Dir stets geneigten</p>
<p align="right"><i>F. Engels</i></p>
<p>Aus dem Englischen.</p>
