<head>
<title>Engels an Laura Lafargue · 17. Januar 1886</title>
</head>
<body>
<p>Tussy, Edward, die Pumps' und Kautskys senden alle herzliche Grüße, freundliche Empfehlungen und Küsse, und ich weiß nicht, was sonst noch alles. Johnny und die anderen Kleinen ditto.</p>
<p align="right">Dein Dir zugetaner, aber hungriger</p>
<p align="right"><i>F. E.</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
</html>
