<title>Engels an Nikolai Franzewitsch Danielson · 8. Februar 1886</title>
</head>
<body>
<p>solchen Ländern werden? Annähernd eine Krise alle <span style="display: inline-block; vertical-align: middle; text-align: center; width: 1.2em;"><span style="display: block; border-bottom: 1px solid #000; text-align: center; line-height: 1;">10</span><span style="display: block; text-align: center; line-height: 1;">4</span></span> Jahre, das heißt also praktisch eine Krise ohne Ende. Uns kann's recht sein.<sup><a id="ZF10" href="#F10">10</a></sup></p>
<p align="right" style="text-indent: 0;">Ihr sehr ergeben der<br><i>P. W. Rosher</i><a id="A381"></a></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
<aside>
<hr style="border: 0; border-top: 1px solid #000; margin: 20px 0;">
<p><a id="F10" href="#ZF10">10</a> in der Handschrift deutsch: Uns kann's recht sein.</p>
</aside>
</body>
