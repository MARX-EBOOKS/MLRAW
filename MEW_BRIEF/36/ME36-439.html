<title>Engels an Nikolai Franzewitsch Danielson · 8. Februar 1886</title>
</head>
<body>
<p>solchen Ländern werden? Annähernd eine Krise alle <span style="display:inline-block;text-align:center;line-height:1.1;vertical-align:middle;"><span style="display:block;border-bottom:1px solid #000;">10</span>4</span> Jahre, das heißt also praktisch eine Krise ohne Ende. Uns kann's recht sein.<sup><a id="ZF10" href="#F10">10</a></sup></p>
<p align="right">Ihr sehr ergebener<br><i>P. W. Rosher</i><a id="A381"></a></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
<aside>
<p><a id="F10" href="#ZF10">10</a> in der Handschrift deutsch: Uns kann's recht sein.</p>
</aside>
