<title>Engels an F.H.Nestler & Melle's Verlag · 13.Mai 1886</title>
</head>
<body>
<p>So sehr ich mich, wie Sie sehn, für Ihren Plan interessiere, so leid tut es mir, bei seiner Ausführung mich nicht beteiligen zu können; indem ich Ihnen für Ihren ehrenvollen Antrag danke, empfehle ich mich Ihnen hochachtend</p>
</body>
