<p>3. Sobald aber in Rußland die Revolution losbricht, können die Herren machen, was sie wollen. Dann werden sie aber auch sehn, daß sie mit den Türken nicht fertig werden.</p>
<p>Postschluß.</p>
<p align="right">Dein<br><i>F. E.</i></p>
