<title>Engels an Nikolai Franzewitsch Danielson · 9. November 1886</title>
</head>
<body>
<p>Ich werde heilfroh sein, wenn ich den 3. Bd. herausbringen kann, denn erst dann wird, wie Sie sagen, das ganze System des Autors völlig verständlich, und dann werden auch viele der jetzt erhobenen albernen Einwände gegenstandslos werden.</p>
<p align="right">Ihr ergebener<br><i>P. W. R</i>[osher]<a id="A381"></a></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
</html>
