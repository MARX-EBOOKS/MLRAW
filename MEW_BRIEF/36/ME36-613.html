<title>Engels an Friedrich Adolph Sorge · 12. Februar 1887</title>
</head>
<body>
<p style="text-indent: 0;">Chicago Jury entrüstet<a id="A617"></a>, hier die Schmählichkeit dieser Jury noch überbietet und Leute verdonnert, ohne sie auch nur zu hören, ja ohne ihnen nur zu sagen, wessen sie angeklagt sind.</p>
<p align="right">Dein<br><i>F. E.</i></p>
