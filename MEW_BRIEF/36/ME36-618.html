<title>314 · Engels an Nikolai Franzewitsch Danielson · 19.Februar 1887</title>
</head>
<body>
<p>Bis jetzt sind keine Rezensionen der englischen Ausgabe erschienen. Die berufsmäßigen Rezensenten wissen augenscheinlich nicht, was sie von dem Buch halten sollen, und haben Angst, sich die Finger zu verbrennen.</p>
<p align="right">Ihr ergebenener<br><i>P. W. Rosher</i><a id="A381"></a></p>
<p><b>Aus dem Englischen.</b></p>
</body>
