<title>342 · Engels an Laura Lafargue · 7. Juni 1887</title>
</head>
<body>
<p>Sam Moore möchte wissen, ob Paul den Beckmann, „<i>Hist[ory] of Inventions</i>“ <a id="A788"></a>, den er ihm geschickt, erhalten hat.</p>
<p align="right">In Zuneigung Dein<br><i>F. E.</i></p>
<p>Nim läßt herzlich grüßen. Sie ist nach dem Winter ziemlich asthmatisch.</p>
<p>Aus dem Englischen.</p>
</body>
