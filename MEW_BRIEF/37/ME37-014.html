<title>4 · Engels an Wilhelm Liebknecht · 10. Januar 1888</title>
</head>
<body>
<p style="text-indent: 0;">Der Haß der Arbeiter gegen die Polizei ist kolossal, und bei der nächsten Wahl werden die dummen Tories dran denken.</p>
<p>Prosit Neujahr nachträglich, und möge es innerlich und äußerlich Frieden bleiben, ich möchte jetzt weder Krieg noch Putsche, dafür geht alles zu famos.</p>
<p align="right">Dein</p>
<p align="right"><i>F. Engels</i></p>
</body>
