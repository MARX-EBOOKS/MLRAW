<title>5 · Engels an Hermann Schlüter · 10. Januar 1888</title>
</head>
<body>
<p>aufgeklärt wurde, welchen saubern Vogel er protegierte, obwohl er ihn auch dann noch zu halten suchte.</p>
<p>Ihren freundlichen Neujahrswunsch herzlich erwidern,</p>
<p align="right">der Ihrige</p>
<p align="right"><i>F. E.</i></p>
