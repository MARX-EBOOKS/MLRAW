<p>können<a id="A29"></a> und es Ihnen dann gleich zuschicken. Leider erfordern meine Augen immer noch Schonung.</p>
<p>Mit aufrichtigem Gruß</p>
<p align="right">der Ihrige<br><i>F. Engels</i></p>
<p>„Mefistofele“ I folgt heute abend.</p>
