<title>15 · Engels an Laura Lafargue · 25. Februar 1888</title>
</head>
<body>
<p>glaube wohl, Kalbskoteletts – rufen. Lebe wohl für heute, und mögen die Hosen Pauls mit ihrer Überlänge auch ihren Geruch sauren Kleisters verlieren – ein Parfüm, das einem alten Manchestermann leider nur zu gut bekannt ist!</p>
<p align="right">Immer Dein<br><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
