<title>62 · Engels an August Bebel · 25. Oktober 1888</title>
</head>
<body>
<p>Ich bin jetzt am III.Band „Kapital“. Meine Augen soll ich noch sehr schonen, nicht mehr als 2 Stunden täglich schreiben und nur bei Tageslicht. Da wird meine Korrespondenz recht sehr beschnitten werden müssen.</p>
<p style="text-indent: 4em;">Gruß an Singer.</p>
<p align="right">Dein<br><i>&nbsp;&nbsp;&nbsp;F. E.</i></p>
</body>
