<title>Engels an Karl Kautsky · 28. Januar 1889</title>
</head>
<body>
<p style="text-indent: 0;">er will. Er braucht nur irgendeine Schnäbelei<a id="A157"></a> anzustiften – die kann Boulanger nicht so einstecken wie Ferry.</p>
<p>Grüß Louise herzlich von Nim und mir.</p>
<p align="right">Dein<br><i>F. E.</i></p>
<p>Grüß mir meine treuen Neujahrsg gratulanten, und namentlich Frankel.<br>Ihr scheint dort wieder gut in Zug zu kommen.</p>
