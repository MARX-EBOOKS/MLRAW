<title>128 · Engels an Laura Lafargue · 27. August 1889</title>
</head>
<body>
<p>Edward und Tussy werden nach Dundee gehen, um über den Trade-Union-Kongreß<a id="A283"></a> zu berichten, und wir werden dann die Jungen<sup><a id="ZF10" href="#F10">10</a></sup> inzwischen hierhaben.</p>
<p align="right">Immer Dein<br><i>F. Engels</i></p>
<p>Aus dem Englischen.</p>
<aside>
<p><a id="F10" href="#ZF10">10</a> Jean und Edgar Longuet</p>
</aside>
