<title>135 · Engels an Laura Lafargue · 8. Oktober 1889</title>
</head>
<body>
<p>daß sie sehnsüchtig ihren Anteil an Birnen, Weintrauben und anderen guten Dingen erwartet, die jetzt reif sein werden.</p>
<p>Würdest Du bitte Paul den inliegenden Scheck von £ 20 überreichen.</p>
<p align="right">Immer Dein alter<br><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
