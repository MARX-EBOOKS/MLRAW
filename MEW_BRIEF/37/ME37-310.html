<title>147 · Engels an Laura Lafargue · 16. November 1889</title>
</head>
<body>
<p style="text-indent: 0;">Anteil beträgt leider nur £ 1.17.6, aber schließlich sieht es in Francs viel mehr aus.</p>
<p>Wir haben mit Miss Harkness eine neue Mutter Schack bekommen. Doch dieses Mal haben wir sie festgenagelt, und sie wird merken, mit wem sie es zu tun hat.</p>
<p align="right">Immer Dein<br><i>F. E.</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
