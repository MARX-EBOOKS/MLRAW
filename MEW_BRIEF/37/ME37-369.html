<title>173 · Engels an Laura Lafargue · 14. März 1890</title>
</head>
<body>
<p>Wir sind heute nach Highgate gegangen. Tussy war bereits morgens da und bepflanzte das Grab von Mohr und Mama sehr schön mit Krokus, Schlüsselblumen, Hyazinthen usw. Wenn Mohr das sehen könnte!</p>
<p>Aus dem Englischen.</p>
