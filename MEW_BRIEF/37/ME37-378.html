<title>180 · Engels an Ferdinand Domela Nieuwenhuis · 9.April 1890</title>
</head>
<body>
<p>Schlußdurchsicht druckfertig. Könnte ich ein Jahr ganz aus der laufenden internationalen Bewegung heraustreten, keine Zeitungen lesen, keine Briefe schreiben, mich in nichts mischen, so wäre ich leicht fertig.</p>
<p>Mit freundlichem Gruß.</p>
<p align="right">Der Ihrige<br><i>F. Engels</i></p>
