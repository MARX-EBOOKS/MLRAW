<title>200 · Engels an Laura Lafargue · 4. Juli 1890</title>
</head>
<body>
<p>Wenn Mémé hier wäre, würde sie über meine Nase<sup><a id="ZF2" href="#F2">(2)</a></sup> viel zu reden haben. die Sonne hat sie so verbrannt, daß sie an jeder Ecke platzt.</p>
<p>So, nun herzliche Grüße an Euch alle und amüsiert Euch gut.</p>
<p align="right">Immer Euer<br><i>F. Engels</i></p>
<p>Aus dem Englischen.</p>
<aside>
<p><a id="F2" href="#ZF2">(2)</a> in der Handschrift deutsch: Nase</p>
</aside>
</body>
</html>
