<title>227 · Engels an Laura Lafargue · 26.September 1890</title>
</head>
<body>
<p style="text-indent: 0;">keiten geben, doch nach dem, was ich hörte, glaube ich, daß ich mich durchgesetzt habe.</p>
<p>Die Kiste mit Birnen ist bis heute 3 Uhr nachmittags noch nicht eingetroffen, doch sie wird höchstwahrscheinlich vor dem Abendessen hier sein.</p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
