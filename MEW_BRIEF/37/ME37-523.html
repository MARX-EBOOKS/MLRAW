<title>254 · Engels an Karl Kautsky · 13.Dezember 1890</title>
</head>
<body>
<p>Von Heft 8<a id="A501"></a> würdest Du mich verpflichten, wenn Du mir noch 6 Ex. schicktest, das wird wohl genügen.</p>
<p>Jetzt aber muß ich schließen, ich lege noch zwei Zeilen an Dietz bei zur gefälligen Abgabe.</p>
<p align="right">Dein alter<br><i>F. Engels</i></p>
</body>
