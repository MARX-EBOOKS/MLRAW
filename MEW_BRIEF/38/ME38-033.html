<p>home-rule<sup><a id="ZF6" href="#F6">6</a></sup>. Sie haben das Verdienst, zum ersten Male die Arbeiterbewegung in Irland in Fluß gebracht zu haben. Viele ihrer branches bestehn aus agricultural labourers<sup><a id="ZF7" href="#F7">7</a></sup>.</p>
<p>Beste Grüße an Deine Frau.</p>
<p align="right">Dein<br><i>F. E.</i></p>
