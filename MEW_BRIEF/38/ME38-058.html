<title>28 · Engels an Karl Kautsky · 17. März 1891</title>
</head>
<body>
<p>Percy und Familie gehn nächstens nach Ryde, Isle of Wight, wo Percy eine Agentur für seine Brüder einrichten und führen soll.</p>
<p>Beste Grüße</p>
<p align="right">von Deinem<br><i>F. E.</i></p>
</body>
