<title>38 · Engels an Paul Lafargue · 3. April 1891</title>
</head>
<body>
<p>Schorl[emmer] ist von seiner Erkältung fast wiederhergestellt, aber er scheint recht angegriffen.</p>
<p>Wir erwarten Sie nächste Woche, damit Sam Ihnen eine Menge über Ihre Negervorfahren erzählen kann.</p>
<p style="text-indent: 0;">Aus dem Französischen.</p>
</body>
