<title>77 · Engels an Paul Lafargue · 13. Oktober 1891</title>
</head>
<body>
<p>Auch von Pumps und ihren Kindern, die noch hier sind; die Kleine<sup><a id="ZF5" href="#F5">5</a></sup> braucht eine Stahlstütze für ihren Rücken (sie wächst zu schnell), und der Mechaniker zieht die Sache schon tagelang hinaus.</p>
<p style="text-indent: 0;">Aus dem Französischen.</p>
<aside>
<p><a id="F5" href="#ZF5">5</a> Lilian Rosher</p>
</aside>
