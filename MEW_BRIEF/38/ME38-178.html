<title>79 · Engels an Laura Lafargue · 13. Oktober 1891</title>
</head>
<body>
<p style="text-indent: 0;">„<i>Socialiste</i>“ nicht finden und habe keine anderen Zeitungen zur Hand – und welche Chancen hast Du, der Bezahlung zu entgehen?</p>
<p>Grüße von Louise, Pumps, den Kindern und Deinem alten, immer durstigen (der mit Pumps ein Bier trinken geht)</p>
<p align="right"><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
