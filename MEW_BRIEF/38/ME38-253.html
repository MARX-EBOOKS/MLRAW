<title>108 · Engels an Laura Lafargue · 20. Januar 1892</title>
</head>
<body>
<p>doch bis jetzt sind unsere beiden Hausangestellten nur davon gestreift worden. Louise leidet an dem, was meine arme Frau<sup><a id="ZF8" href="#F8">8</a></sup> „Schmerzen überall“ (allgemeiner Muskelrheumatismus) zu nennen pflegte, aber mich hat es noch nicht erwischt.</p>
<p align="right">Immer Dein<br><i>F. Engels</i></p>
<p>Aus dem Englischen.</p>

<p><a id="F8" href="#ZF8">8</a> Lizzy Burns</p>
