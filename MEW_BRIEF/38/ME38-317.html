<title>137 · Engels an Laura Lafargue · 4. April 1892</title>
</head>
<body>
<p>Nächste Woche erwarten wir Bebel hier, wenn er nicht durch Krankheit verhindert wird – er scheint durch Überarbeitung und Überreizung sehr unpäßlich zu sein.</p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
