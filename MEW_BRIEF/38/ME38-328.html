<title>142 · Engels an Pasquale Martignetti · 21. April 1892</title>
</head>
<body>
<p>Fantuzzi schien mir von Anfang an ein Humbug, ich glaube, Sie täten gut, sich die Ms. und korrigierten Druckbogen von ihm zurückzuerbitten, wer weiß, ob er überhaupt noch etwas drucken will?<a id="A396"></a></p>
<p align="right">Aufrichtigst Ihr<br><i>F. Engels</i></p>
</body>
