<title>152 · Engels an Ludwig Schorlemmer · 17. Mai 1892</title>
</head>
<body>
<p>sicher Grüße schicken; Frau Kautsky erwidert Ihre Grüße herzlich, und ebenso bitte ich Sie, die meinigen anzunehmen und mich Ihrer ganzen Familie bestens zu empfehlen.</p>
<p align="right">Der Ihrige<br><i>F. Engels</i></p>
<p>Meine Nichte Frau Rosher, genannt Pumps, die ebenfalls hier ist, schickt ihre besten Grüße an Sie alle.</p>
