<title>174 · Engels an August Bebel · 6. Juli 1892</title>
</head>
<body>
<p align="center"><i>[Nachschrift von Engels]</i></p>
<p>Das letzte Wort muß sie doch haben.</p>
<blockquote><p align="center"><i>[Nachschrift von Louise Kautsky]</i></p>
<p>Das geschriebene Wort.</p></blockquote>
<p align="center"><i>[Nachschrift von Engels]</i></p>
<p>Nitschewo!</p>
</body>
