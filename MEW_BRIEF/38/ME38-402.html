<p style="text-indent: 0;">spezielle Tatsachen, die Mogeleien der verschiednen Parteien betreffend, ganz was andres, als worüber Du schreiben kannst.</p>
<p>Herzliche Grüße von Louise und mir an Euch beide.</p>
<p align="right">Dein</p>
