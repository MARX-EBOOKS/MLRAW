<title>180 · Engels an Paul Lafargue · 22. Juli 1892</title>
</head>
<body>
<p>Ich hoffe, daß Laura sich wohl fühlt, man hört kein Wort von ihr.<a id="A455"></a> Da ich zu weit entfernt bin, um sie zu umarmen, tun Sie es für mich.</p>
<p>Ihnen alles Gute, mein Herr Ewiger Jude<a id="A316"></a>.</p>
<p align="right"><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Französischen.</p>
</body>
