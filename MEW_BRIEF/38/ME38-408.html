<p style="text-indent: 0;">entfernt, haben wir dafür büßen müssen, und deshalb stelle ich sie Dir hiermit nochmals zur Verfügung.</p>
<p>Also herzlichen Gruß auch an Frau Julie von</p>
<p align="right">Deinem<br><i>General</i></p>
<p>Auf Wunsch von Siegel lege ich seinen letzten Brief bei.</p>
