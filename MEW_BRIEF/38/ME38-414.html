<title>184 · Engels an Ludwig Schorlemmer · 25. Juli 1892</title>
</head>
<body>
<p>Beste, aber sie ist sehr alt, und der Schlag, der sie mit Carls Tod getroffen hat, war sehr, sehr hart! Aber trotz alledem hoffe ich, Sie werden mir bald beßre Nachricht geben können.</p>
<p align="right">Aufrichtigst der Ihrige</p>
<p align="right"><i>F. Engels</i></p>
</body>
