<title>186 · Engels an Ludwig Schorlemmer · 28. Juli 1892</title>
</head>
<body>
<blockquote><p align="center"><i>[Nachschrift von Mary Ellen Rosher]</i></p>
<p>Ich kann diesen Brief meines Onkels nicht abgehn lassen, ohne Ihnen und Ihrer ganzen Familie meine aufrichtige Teilnahme bei dem Tod Ihrer lieben Mutter auszusprechen. Sein Sie alle herzlich gegrüßt von Ihrer</p>
<p align="right"><i>Ellen Rosher</i></p></blockquote>
</body>
