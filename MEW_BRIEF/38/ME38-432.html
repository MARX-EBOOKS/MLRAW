<title>193 · Engels an Victor Adler · 19. August 1892</title>
</head>
<body>
<p style="text-indent: 0;">Nächstes Jahr denk' ich's aber gutzumachen. Und laß Dich selbst herzlich grüßen von Deinem alten lahmen</p>
<p align="right"><i>F. E.</i></p>
<p>Ich bleibe hier jedenfalls bis 31. ds.<a id="A454"></a></p>
<p style="text-indent: 0;">Nach: Victor Adler,<br>„Aufsätze, Reden und Briefe“,<br>Heft 1, Wien 1922.</p>
