<title>9 · Engels an Karl Kautsky · 26. Januar 1893</title>
</head>
<body>
<p style="text-indent: 0;">Aufmunterung und Aufheiterung ist das, was er jetzt am meisten nötig hat, damit sein gesundes Urteil wieder vollständig die Oberhand über sein immer noch etwas übertriebenes Gerechtigkeitsstreben bekommt.</p>
<p>Sonst nichts Neues – nachträglich auch mein Prosit Neujahr.</p>
<p align="right">Dein<br><i>F. E.</i></p>
