<title>31 · Engels an Laura Lafargue · 21. März 1893</title>
</head>
<body>
<p style="text-indent: 0;">etwas anderes, nämlich daran, daß ich nicht vergessen darf, den Scheck über zehn Pfund beizulegen. Mit herzlichen Grüßen von Louise verbleibe ich</p>
<p align="right">in Zuneigung Dein<br><i>F. Engels</i></p>
<p style="text-indent: 0;"><b>Aus dem Englischen.</b></p>
