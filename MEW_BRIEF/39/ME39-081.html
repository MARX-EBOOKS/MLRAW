<title>46 · Engels an Filippo Turati · 6. Juni 1893</title>
</head>
<body>
<p style="text-indent: 0;">Es sind nur Druckfehler zu korrigieren, aber in einem Buch dieser Art spielt auch das eine Rolle.</p>
<p>Dank für die Übersetzung des „Manifests“.<a id="A1"></a></p>
<p>Viele Grüße an Frau Kulischowa und an Sie von Frau Kautsky und</p>
<p align="right">Ihrem sehr ergebenen<br><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Französischen.</p>
