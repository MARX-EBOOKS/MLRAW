<title>Engels an Friedrich Adolph Sorge · 11. November 1893</title>
</head>
<body>
<p>Herzliche Grüße Dir und Deiner Frau. Hoffentlich kommt Ihr besser über den Winter als das vorige Mal. Hier fängt's schon an, winterlich zu werden.</p>
<p align="right">Dein<br><i>F. E.</i></p>
</body>
