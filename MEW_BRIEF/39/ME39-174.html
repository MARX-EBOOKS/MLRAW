<title>85 · Engels an Friedrich Adolph Sorge · 2. Dezember 1893</title>
</head>
<body>
<p>Herzliche Grüße Dir und Deiner Frau und gute Besserung! von L. K[autsky] und</p>
<p align="right">Deinem</p>
<p align="right"><i>F. Engels</i></p>
<p>L. K[autsky] schreibt bald Antwort, dankt für Deine Liebenswürdigkeit, hat wegen „Arb[eiter]-Ztg." (Wien) bereits geschrieben, „Pionierkalender" ist <i>nicht</i> gekommen.</p>
