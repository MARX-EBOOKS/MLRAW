<p>Wegen des III. Bandes<sup><a id="ZF4" href="#F4">4</a></sup> sei ruhig. So oder so sollt Ihr in die Lage versetzt werden, gleich mit Erscheinen des Buchs die Kritik zu geben.</p>
<p>Beste Grüße von Haus zu Haus.</p>
<p align="right">Dein</p>
<p align="right"><i>F. E.</i></p>
