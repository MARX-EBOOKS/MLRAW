<title>97 · Engels an Karl Kautsky · 9. Januar 1894</title>
</head>
<body>
<p style="text-indent: 0;">Gewerkschafts- wie der tschechische Kongreß<a id="A238"></a> den Generalstrike auf die lange Bank des Parteitags<a id="A239"></a> geschoben, und V[ictor] wird schon sorgen, daß er da noch weiter geschoben wird.</p>
<p>Schluß für heute – noch Massen Briefe. Grüße von Haus zu Haus.</p>
<p align="right">Dein</p>
<p align="right"><b><i>F. E.</i></b></p>
</body>
