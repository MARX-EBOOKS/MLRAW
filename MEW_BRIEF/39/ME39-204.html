<h1>Engels an Albert Delon<br>in Nîmes <a id="A244"></a><br>(Notiz)</h1>
<p align="right">[London, um den 21. Januar 1894]</p>
<p>Soll den 2ten Band erst lesen und dann wiederkommen.</p>
<p>Nach Brief an Diamandi kann er noch nicht vollkommen Deutsch, sondern studiert noch dran, besonders an der Sprache der politischen Ökonomie.</p>
