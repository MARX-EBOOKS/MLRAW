<title>115 · Engels an Friedrich Adolph Sorge · 21. März 1894</title>
</head>
<body>
<p style="text-indent: 0;">bedeutende wissenschaftliche Karriere vor sich hat, er praktiziert an hiesigen Spitälern. Einstweilen ist er zu uns gezogen, so daß Louises Adresse bis auf den Namen unverändert.</p>
<p align="right">Dein<br><i>F. Engels</i></p>
<p>Herzliche Grüße Dir und Deiner Frau von Louise und mir. Hoffentlich geht’s besser mit der Gesundheit.</p>
