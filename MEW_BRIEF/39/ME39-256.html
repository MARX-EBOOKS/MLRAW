<title>134 · Engels an Paul Lafargue · 2. Juni 1894</title>
</head>
<body>
<p>Uarmen Sie Laura für mich!</p>
<p>Grüße von Louise und Ludwig. Letzterer zeigt den englischen Ärzten auch weiterhin, wie sehr ihnen die Kollegen vom Kontinent in der wahren Wissenschaft, Anatomie, Physiologie, Pathologie usw. überlegen sind.</p>
<p align="right">Herzlichst<br><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Französischen.</p>
