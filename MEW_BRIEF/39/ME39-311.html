<title>164 · Engels an Friedrich Adolph Sorge · 10. November 1894</title>
</head>
<body>
<p>Ich hoffe, Dir und Deiner Frau geht's besser als nach Deinen letzten Nachrichten. Mir geht's nicht schlecht, aber man merkt doch auch mit der Zeit, daß zwischen 73 und 37 ein starker Unterschied ist.</p>
<p>Herzliche Grüße Dir und Deiner Frau</p>
<p align="right">Dein</p>
<p align="right"><i>F. Engels</i></p>
</body>
