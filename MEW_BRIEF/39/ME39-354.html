<title>186 · Engels an Victor Adler · 22. Dezember 1894</title>
</head>
<body>
<p style="text-indent: 0;">urteilen müssen, während unsere Partei die einzige ist, die ihn von vornherein richtig beurteilen wird.</p>
<p>Und nun, vergnügte Weihnachten Dir, Deiner Frau (die ich herzlich zu grüßen bitte) und Deinen Kindern!</p>
<p align="right">Dein</p>
<p align="right"><i>F. E.</i></p>
<p style="text-indent: 0;">Nach: Victor Adler,<br>„Aufsätze, Reden und Briefe“,<br>Heft 1, Wien 1922.</p>
