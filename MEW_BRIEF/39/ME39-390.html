<title>204 · Engels an Laura Lafargue · 19. Januar 1895</title>
</head>
<body>
<p>An Paul werde ich schreiben, sobald ich nur einen Augenblick Zeit finde. Dank für die Zeitungen, die ich nach dem Lesen an Tussy weitergeschickt habe.</p>
<p align="right">Immer Dein<br><i>F. Engels</i></p>
<p style="text-indent: 0;">Aus dem Englischen.</p>
</body>
