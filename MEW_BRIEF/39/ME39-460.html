<p style="text-indent: 0;">hingegangen<a id="A90"></a> und hätte nachgesehn, und wir wären auch in andern Dingen ein gut Stück weiter.</p>
<p>Ist der Baake ein Bruder des Kurt B[aake]?</p>
<p>Grüße allerseits.</p>
<p align="right">Dein<br><i>F. E.</i></p>
