<title>251 · Engels an Carl Hirsch · 20. Mai 1895</title>
</head>
<body>
<p style="text-indent: 0;">Zeit ist verdammt kurz. <i>Woher</i> hattet Ihr die Notiz? Forscht dort nach, bis Ihr heraus habt, <i>wie und durch wen</i> sie in die deutsche Presse kam, das gibt Anhalt.</p>
<p>Viele Grüße.</p>
<p align="right">Dein<br><i>F. E.</i></p>
</body>
