<title>253 · Engels an die Redaktion der „Rheinischen Zeitung“ · 22. Mai 1895</title>
</head>
<body>
<p style="text-indent: 0;">auch Erklärungen drucken lassen in Englisch, daß er keine Gefängnisarbeit verkauft, er behauptet nämlich, Brauweiler sei kein Gefängnis, sondern bloß eine Besserungsanstalt. Solche Unterschiede ziehn aber hier nicht.</p>
<p>Morgen mehr, falls nicht inzwischen einer kommt.</p>
<p align="right">Beste Grüße von Ihrem<br><i>F. Engels</i></p>
