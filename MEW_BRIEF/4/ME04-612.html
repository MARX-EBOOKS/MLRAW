</head>
<body>
<p>Mittwoch erhalten die 6 arretierten Ausländer ihren Expulsionspaß. Aber der von Wolff datiert vom 27. Februar, Sonntags, noch vor seiner Arretation. Im Gefängnis schauderhaft behandelt.</p>
<p style="text-indent: 0;">Nach der Handschrift.</p>
