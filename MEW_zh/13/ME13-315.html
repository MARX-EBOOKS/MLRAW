</head>
<body>
<p>会早已作出了判决。德国人开始懂得，<i>quid pro quo</i>〔混淆是非〕的作法使他们坠入迷雾，开始懂得保卫奥地利所必需的军事阵地，对于保卫德国完全是不需要的，法国人也有同样的权利，甚至有更多的权利把莱茵河看做是自己的自然军事疆界，就像德国人对波河、明乔河和阿迪杰河所持的看法一样。</p>
