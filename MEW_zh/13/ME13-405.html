<p>这样，作战军队便增加到 6 个军，即不少于 20 万人；此外，还有其他几个军正在途中。但是，由于路易 - 拿破仑不能长期按兵不动，所以会战不久一定发生。据报道，他已率大本营和近卫军转到沃格拉——联军阵地的极右翼。这一报道说明会战可能在斯特拉杰拉郊区发生。如果是这样的话，我们很可能会看到，奥军将从正面保卫斯特拉杰拉隘路，并企图通过瓦卡里察附近的桥梁而在法军翼侧和后方作战。</p>
