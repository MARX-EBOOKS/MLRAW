<body>
<p>国也为英国的可靠消息所否认。我们请读者注意这个事实，不只是为了要对双方严守公道，而且是因为我们对于这些报道的不信任曾被曲解为我们对于弗兰茨 - 约瑟夫的同情；其实，与此相反，我们甚至不希望这位帝王被推翻的日期延迟一天。如果他能和拿破仑互相残杀而同归于尽，那末这将是历史的公正判决的圆满结果。</p>
