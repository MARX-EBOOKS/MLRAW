<title>一八五九年的爱尔福特精神</title>
</head>
<body>
<p style="text-indent: 0;">器啊！它可以用来对付疯狂的波拿巴主义和被弄得绝望了的，由于国内遭到了威胁而被迫在德国土地上争取自己生存的沙皇制度。我觉得，在 1848 年和 1849 年我们已经充分领略了这二者的滋味，因此我们懂得，把自己的革命力量耗费在高谈立宪的人民代议制上面的任何人民运动，都是注定要灭亡的。</p>
