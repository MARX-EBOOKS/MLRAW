<body>
<p>我们看到，采用这个方法时，逻辑的发展完全不必限于纯抽象的领域。相反，它需要历史的例证，需要不断接触现实。因此这里举出了各种各样的例证，有的指出各个社会发展阶段上的现实历史进程，有的指出经济文献，以便从头追溯明确作出经济关系的各种规定的过程。对于个别的、多少是片面的或混乱的见解的批判，实质上在逻辑发展本身中已经作出了，因此可以叙述得很简略。</p>
<p>在第三篇论文中，我们将说明本书的经济内容。</p>
