<p>事实：政府一年内的非常支出近 1 400 万英镑。虽然这种情况足以说明英国对印度的出口贸易的突然增长，但是很难设想，它预告着这种新的变动会比较长久地继续下去。这种形势最久远的后果自然就是印度的民族工业遭到彻底破坏，因为读者从最后一个图表中已经看到，不列颠对印度的出口余额主要是由于不列颠的棉布和棉纱的输入所造成的。曼彻斯特方面的销售量的过度扩大在一定程度上也会使不列颠出口图表数字膨胀起来。</p>
