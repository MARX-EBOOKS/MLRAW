<p>报纸“每日电讯”透露出来，该报在最近某一期上写道：</p>
<blockquote>
<p>“如果明年有任何事件会引起不利于政府的表决，那必将诉诸全体选民了…… 宣称蒙古人完全有理的那些没有国家观念的人们，应当归入以迪斯累里先生为首的一贯不怀好意的分子之列，下院有鉴于此，将要用对于中国问题的决定来考验自己的活动的结果。”</p>
</blockquote>
<p>至于托利党人由于听任自己受骗去对帕麦斯顿所策划、由他的两个代理人额尔金勋爵和普鲁斯先生（额尔金勋爵的弟弟）所执行的事件负责而陷入尴尬境地，我也许会找到别的机会来加以评论。</p>
