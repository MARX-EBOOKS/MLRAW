<title>对华贸易</title>
</head>
<body>
<p>与手工业的结合是以土地所有制的特殊性质为基础的，而英国人凭着自己作为当地至高无上的土地所有者的势力，能够破坏这种土地所有制，并从而强使一部分印度自给自足的村庄变成了生产鸦片、棉花、靛青、大麻以及其他原料去交换英国货的简单农场。在中国，英国人现在还没有这种势力，而将来也未必能够做到这一点。</p>
