<p style="text-indent: 0;">话，那就不可避免地要进入沙漠；同时，这个计划使战场接近西班牙的国境，其间只有直布罗陀海峡之隔。但是不论这个计划有什么优点，如果计划不能实现，这些优点就都是毫无用处的。如果奥当奈尔照原来那样继续下去，那末，不管他在公报上说得多么漂亮，他也会使他自己和西班牙军队的名誉蒙受耻辱。</p>
