<title>弗·恩格斯</title>
</head>
<body>
<p>只要一宣战这种中立就不会再存在了。如果一个强大的和好战的国家随时都可能击溃它的中立的邻邦，那就不可能有任何的中立。</p>
<p>这个表面看来是无恶意的吞并萨瓦和尼斯的计划无非是要在意大利和瑞士建立法国的统治，即保证法国在阿尔卑斯山的统治地位。在这个小步骤实现以后，到我们亲眼看到在莱茵河上也建立起法国统治的企图以前，难道还需要经过很长的时间吗？</p>
