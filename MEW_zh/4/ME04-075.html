<h1>序 言</h1>
<p>蒲鲁东先生不幸在欧洲异常不为人了解。在法国，人家认为他理应是一个拙劣的经济学家，因为他在那里以卓越的德国哲学家著称。在德国，人家却认为他理应是一个拙劣的哲学家，因为他在那里以最杰出的法国经济学家著称。我们是德国人同时又是经济学家，我们要反对这一双重错误。</p>
<p>读者将会明白，为什么我们在做这件不讨好的工作时常常不得不放下对蒲鲁东先生的批判，而去批判德国的哲学，同时还要对政治经济学作某些评论。</p>
<p align="right">卡尔·马克思</p>
<p align="right">1847 年 6 月 15 日于布鲁塞尔</p>
