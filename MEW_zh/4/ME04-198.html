<body>
<p>在这以前，资产阶级和无产阶级间的对抗仍然是一个阶级反对另一个阶级的斗争，这个斗争一旦达到最紧张的地步，就成为全面的革命。可见，建筑在阶级对立上面的社会最终将成为最大的<b>矛盾</b>、将导致人们的肉搏，这用得着奇怪吗？</p>
<p>不能说社会运动排斥政治运动。从来没有哪一种政治运动不同时又是社会运动的。</p>
<p>只有在没有阶级和阶级对抗的情况下，<b>社会进化</b>将不再是<b>政治革命</b>。而在这以前，在每一次社会全盘改造的前夜，社会科学的<b>结论</b>总是：</p>
<blockquote>
<p>“不是战斗，就是死亡；不是血战，就是毁灭。问题的提法必然如此。”（乔治·桑）<sup><a id="ZF74" href="#F74">74</a></sup></p>
</blockquote>
