<p>这个国民公会认为自己有权审查前国王的呼吁，经过一番讨论，呼吁者被押到革命广场，并于 1793 年 1 月 21 日上了断头台。</p>
<p>这就是国王呼吁自己人民的结局。至于国教顾问想成立民主君主制的算盘会得到什么结果，我们不久就会看到。</p>
