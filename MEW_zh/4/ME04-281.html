<p>象狗一样地向前突出；显然，他不能容忍任何矛盾，但也并没有引起应有的恐惧。关于他对无产阶级的轻率的攻击，布朗基先生曾经这样说过：“杜诺无耶先生向人民述说的这些严酷的道理，伏尔泰和卢梭在上一世纪曾奉献给各位君王。”</p>
<p>一般性的争论就到此结束。第二天第三天就个别问题进行的讨论，我们在最近一期<sup>[121]</sup>上再谈。</p>
