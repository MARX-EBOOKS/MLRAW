<p>国工人真要受宠若惊了，原来只要他们对待民主主义者卡尔·海因岑谦逊有礼，这位伟大人物就会同他们进行辩论。无奈海因岑先生本来就没有资格同斯蒂凡先生进行论争，所以他才竭力用他那无耻的攻击来弥补这一缺陷。</p>
