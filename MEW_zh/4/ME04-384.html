<p>巴黎的其他各报也都从各个不同的方面表示不同意拉马丁先生的纲领。可是他还在自己的报纸，马康“公益报”<sup>[170]</sup>上继续解释这个纲领中的原则。几个月以后我们就可以看出众议院对他这个<b>新步骤</b>的反应如何了。</p>
