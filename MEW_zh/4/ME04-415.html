<title>纪念 1830 年波兰革命</title>
</head>
<body>
<p style="text-indent: 0;">欧洲三大民主主义的报纸——“改革报”、“北极星报”和“德意志—布鲁塞尔报”致敬；经沙佩尔先生的提议，三次高呼反对三家反民主主义的报纸——“辩论日报”、“泰晤士报”和奥格斯堡的“总汇报”。</p>
<p>与会者全体脱帽肃立，高唱“马赛曲”，大会在歌声中结束。</p>
