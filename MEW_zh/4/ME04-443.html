<title>菲格斯·奥康瑙尔和爱尔兰人民</title>

<p>者今后就一起遭受同样的压迫和贫困、同样依赖于资本家特权统治阶级。</p>
<p>毫无疑问，今后爱尔兰人民群众将会愈来愈紧密地同英国宪章派团结一致并按照共同计划行动。这样，英国民主主义者的胜利以及爱尔兰的解放就一定会提早很多年。奥康瑙尔告爱尔兰人民书的意义就在于此。</p>
