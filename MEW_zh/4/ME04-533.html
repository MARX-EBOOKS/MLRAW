<p style="text-indent: 0;">是刚刚开始。</p>
<p>因此，德国人首先必定会在其他一切民族的面前把自己的名声弄得一败涂地，他们必定会比今天更加成为全欧洲的笑柄，必须迫使他们起来革命。到那时候他们就会真正站起来，不过那不是胆怯的德国庸人们，而是德国的工人；他们将起来彻底结束肮脏的和摇摇欲坠的德国当局的统治，而通过激进的革命来恢复德国的荣誉。</p>
