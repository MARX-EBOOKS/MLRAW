<p>我的妻子的全部罪名就是她虽然出身于普鲁士贵族，却赞成丈夫的民主信念。</p>
<p>关于这件令人愤怒的事情的全部细节，我不想再详谈了。只告诉你一点，当我们被释放时，二十四小时的限期已满，我们不得不立即离开，连最必需的东西也没有来得及带走。</p>
<p align="center">布鲁塞尔民主协会副主席</p>
<p align="center"><b>卡尔·马克思</b></p>
