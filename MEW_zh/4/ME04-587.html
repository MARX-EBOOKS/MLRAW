<title>共产主义者同盟中央委员会 1848 年 3 月 3 日的决议</title>
</head>
<body>
<p>3. 布鲁塞尔中央委员会委托马克思：一俟情况许可，就亲自选择人员在巴黎成立新的中央委员会，其组成人员应是最适当的盟员，为此甚至可以将不住在巴黎的盟员召去。</p>
<p>4. 解散布鲁塞尔中央委员会。</p>
<p>本决议于 1848 年 3 月 3 日在布鲁塞尔通过。</p>
<p align="center"><b>中央委员会</b></p>
<p align="center">签名：恩格斯，弗·费舍，日果，<br>亨·施泰因根斯，卡·马克思</p>
