<title>共产主义者同盟巴黎支部 1848 年 3 月 9 日联席会议记录</title>
</head>
<body>
<p>盟的总的情况的报告。</p>
<p>波尔恩曾被派往骑术学校开会并汇报会议情况。三刻钟后他即返回，描述了这个协会<sup>[263]</sup>的糟糕情景。</p>
<p>下一次会议定于本星期六 8 时在圣奥诺莱区格列涅尔街“比利时”咖啡馆举行。</p>
<p>闭会前盟员向秘书报告了自己的名字和住址。马克思提议全体盟员都缠上红色布带。全场一致通过。</p>
<p>通过了沙佩尔的建议：指定一个人给大家代购鲜红色布带。这一任务委托公民查克斯去执行。</p>
<div class="src">
卡尔·马克思写于 1848 年 3 月 9 日
