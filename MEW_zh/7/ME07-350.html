<p>在从事这次成功的 dodge〔投机勾当〕之后，投机者先生们竟如此厚颜无耻，以至他们马上又进行一次大规模抢购，并以此来刺激其他许多资本家也去抢购。证券上涨很多，甚至从这一次交易所投机中可能获得的利润都已经计算出来了。但是在 15 日由于卡诺、德弗洛特和维达尔被宣布为人民的代表，而遭到意想不到的打击。牌价突然发生无法制止的猛跌，任何虚伪的消息和捏造的电报都挽救不了我们投机者的失败命运。</p>
