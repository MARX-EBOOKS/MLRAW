<p>的。然而密谋活动和局部起义都未完全绝迹。1516 年“鞋会”和“穷康拉德”的大多数逃亡者都已经回到士瓦本和莱茵河上游来了，1517 年“鞋会”在黑森林又完全恢复活动。约斯·弗里茨始终把 1518 年旧“鞋会”会旗藏在怀里随身带着，此刻又奔走黑森林各地积极活动。密谋活动又重新组织起来。和 4 年前一样，又讲定要在克尼比斯山上开会。但是秘密没有保持住，政府闻知此事，并采取了坚决措施。很多人被捕被杀；最积极最练达的会员们不得不逃走。约斯·弗里茨也逃走了，这一次他还是没有被抓住，但是大概不久以后他就死在瑞士，因为从此以后就不再有他的消息了。</p>
