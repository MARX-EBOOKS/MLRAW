<title>共产主义者同盟章程</title>
</head>
<body>
<p>部的个别盟员之间的争执由中央委员会最后解决；对中央委员的个人性质的控诉应转交代表大会。同一区部内的支部之间的争执由区的总支部解决；支部和它的区部之间的争执或区部之间的争执由中央委员会解决；同时，在第一种情况下，可以诉诸区域代表会议解决；在第二种情况下，可以诉诸代表大会解决。代表大会还应当解决中央委员会和同盟下级委员会之间的一切意见冲突。</p>
