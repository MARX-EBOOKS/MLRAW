<body>
<p>教养的职员。总之，没有一个阶级是满意的，因为政府有时不得不作的一些小小让步，并不由它自己出资（那样国库是负担不了的），而是靠上层贵族和教士出资进行。至于大银行家和国家证券持有人，那么意大利最近的事变、匈牙利议会中反对派的强大、以及波及整个帝国的异常的不满情绪和要求改革的呼声，自然是丝毫也不会加强他们对奥地利帝国的巩固与支付能力的信心的。</p>
<p>这样，奥地利也在缓慢地但确实地走向伟大的转变，而这时法国忽然爆发了事变，这个事变使逼近的暴风雨立刻倾降下来，驳倒了老弗兰茨关于大厦在他和梅特涅在世的时候还可以维持下去的断语。</p>
<div class="src">
