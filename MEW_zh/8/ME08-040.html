<p style="text-indent: 0;">地方都大。在这之后不久，奥地利议会只好追认农民已经实际实行了的措施，不管施瓦尔岑堡公爵的政府能够恢复什么东西，它却永远不能恢复对农民的封建奴役了。而如果説奥地利在目前又比较平定了，甚至比较强有力了，这主要是因为人民的大多数即农民真正从革命中得到了利益，也因为不管业已复辟的政府侵犯了其他什么东西，农民所争得的这些实际的物质利益却没有受到侵犯。</p>
<p align="right">1851 年 10 月于伦敦</p>
