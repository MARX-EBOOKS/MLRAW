<title>德国的革命和反革命——八</title>
</head>
<body>
<p>是一个发了狂的博学的德意志人，直到今天他在说捷克话时还有错误并且还带有外国腔调。但是就像常有的情形那样，最近四百年历史上的一切事实都证明，捷克民族是个垂死的民族，1848 年它曾做最后一次努力来恢复它从前的生命力，而这次努力的失败足以证明（撇开一切革命方面的考虑不谈）波希米亚此后只能作为德国的一个组成部分而存在，即使它的一部分居民在几百年之内继续说非德国的语言。</p>
<p align="right">1852 年 2 月于伦敦</p>
