<title>弗·恩格斯</title>

<body>
<p>题时都好像根本不知道有法兰克福国民议会存在似的，单只这个事实就足以证明这个机构不过是个由一群轻信的笨伯组成的辩论俱乐部。这些人让各邦政府把自己当作议会傀儡，拿来给各小邦和小城市的小店主和小手工业者开心，因为政府认为暂时有必要转移一下这一部分人的视线。这种作法需要作多久，我们很快就可以看到。但一个值得注意的事实是：在这个议会的所有的<em>“卓越”</em>人物中，任何一个人都<em>丝毫没有感觉到人家要他扮演的是什么角色</em>，甚至直到今天，法兰克福俱乐部的旧日的成员们也还原封未动地保留着他们所特有的<em>历史感觉器官</em>。</p>
<div class="src">
1852 年 3 月于伦敦
</div>
