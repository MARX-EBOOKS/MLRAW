<p style="text-indent: 0;">的三脚祭坛，半夜里被拖下床，关进囚车，投入监狱或流放；他们的神殿被拆毁，他们的嘴被封住，他们的笔被打断，他们的法律被撕毁，这一切都是为了宗教，财产，家庭和秩序。一群群酩酊大醉的兵士对那些站在自己的阳台上的资产者即秩序的狂信者开枪射击，亵渎他们的家庭圣地，炮击他们的房屋以取乐，这一切都是为了财产，家庭，宗教和秩序。最后，资产阶级社会中的败类组成为<b>维护秩序的神圣队伍</b>，而主人公克拉普林斯基<sup>[53]</sup>就以<b>“社会救主”</b>的资格进入了土伊勒里宫。</p>
