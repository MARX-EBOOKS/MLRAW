<body>
<p>且法国站到斜坡上，它就会往下滚，一直滚到底为止。它离底究竟还有多远，这还很难说，但是，它是在非常迅速地向它接近，这是每个人都看得清的。而假如法国过去的历史不被法国人民未来的行动所推翻的话，那么我们就能有把握地预料，愈向下滚，它的后果就愈会出人意表和令人吃惊。在我们的时代，事件以惊人的速度一个跟着一个地发生，从前一个民族需要整整一个世纪才能完成的事情，现在只要几年就能轻易地完成。旧帝国维持了十四年；而这个以最拙劣的形式恢复起来的艺术品，如果它能够维持十四个月，那就算是帝国雄鹰的大幸了。以后会怎样呢？</p>
