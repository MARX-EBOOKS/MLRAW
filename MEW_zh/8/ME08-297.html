<title>流亡中的大人物——三</title>
</head>
<body>
<p>救后不久，大学生叔尔茨便在巴黎发表声明说，他清楚，受他利用的金克尔当然不是 <i>lumen mundi</i> 〔世界的灯塔〕，正是他叔尔茨，而不是别人，肩负着担任未来的德意志共和国总统的使命。这个人，一个曾被“哥特弗利德的褐色的、闪烁着忧郁的火光的眼睛”注视过的“穿棕色燕尾服和浅蓝色外套的”大学生，的确是靠牺牲一个可怜的狱卒而救出了金克尔。这个狱卒现在正因此而坐了牢，不过他怀着一种崇高的感情：他是为争取……哥特弗利德·金克尔的自由而牺牲的受难者<sup>[1]</sup></p>
