<title>英国的选举。——托利党和辉格党</title>
</head>
<body>
<p>一时忘掉了他们背后是没有任何人马的。这就是说，皮尔派就是过去的皮尔的拥护者，目前他们还没有决定归附哪一个政党。而这种犹豫不决，显然是不能成为建立独立政党的充分根据的。</p>
<p>剩下的还有自由贸易派和宪章派。关于他们，我将在下一篇文章中简略地加以说明。</p>
