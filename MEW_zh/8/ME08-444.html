<title>卡·马克思</title>

<body>
<p>人。这些先生离开了国王、神明和教皇是不行的。他们刚一脱离旧的统治者的监护，就已经给自己制造了新的统治者，并且对“异教徒和谋叛者”暴跳如雷。这些人非常令人讨厌：他们揭露了令人不快的真相和公布了有损名誉的事实，因而侮辱了新出现的民主主义之王的尊严，亵渎了新出现的民主主义之神的圣明。</p>
<p align="right">您的特约通讯员<br>1852 年 11 月 16 日于伦敦</p>
