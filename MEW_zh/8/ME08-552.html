<title>卡·马克思</title>
</head>
<body>
<p>说，当在新的下院中重新开始旧的角逐的时候，各政党又会照旧相互削弱，英国的政治又会重新陷入 <i>cercle vicieux</i>〔兜圈子的境地〕。</p>
<p>因此我认为，现在还是同过去一样必须在二者之间作出抉择：或者是让托利党政府继续存在下去，或者是实行议会改革。</p>
<div class="src">
卡·马克思写于 1852 年 12 月 17 日<br>
载于 1853 年 1 月 7 日“纽约每日论坛报”第 3659 号<br>
署名：卡尔·马克思
