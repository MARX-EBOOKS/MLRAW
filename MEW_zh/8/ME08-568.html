<title>卡·马克思</title>

<body>
<p>景象。</p>
<p>当他在敞棚里和破烂的草棚里寻找一个容身之处时，无疑，他侵害了所有权!!!</p>
<p>如果把这个在高度繁荣时期发生的饿死事件告诉西蒂的养尊处优的资本家，那他会用 1 月 8 日伦敦“经济学家”上的话来回答你们：</p>
<blockquote>
<p>“令人高兴的是现在可以看到，在贸易自由时期，一切阶级是如何繁荣昌盛；成功的希望增强着他们的力量；他们都在改善自己的生产，整个社会和每一个人都从中得到好处。”</p>
</blockquote>
<div class="src">
卡·马克思写于 1853 年 1 月 14 日<br>
载于 1853 年 2 月 2 日“纽约每日论坛报”第 3681 号<br>
署名：卡尔·马克思
