<title>议会辩论。——僧侣和争取十小时工作日的斗争。——饿死</title>
</head>
<body>
<p>死者躺在一小堆干草上，身上什么也没有盖。屋子里面用的、烧的、吃的什么也没有。五个小孩子坐在靠近母亲尸体的光秃秃的地板上，由于饥寒而不住地号哭。</p>
<p>关于“强迫移民”的问题，我将在下一篇文章里加以论述。</p>
