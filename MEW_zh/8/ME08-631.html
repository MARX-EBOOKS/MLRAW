<p>靠牺牲土耳其人的利益来进行报复。在下一篇文章中我想谈谈这个老是不断出现的东方问题，这个欧洲外交上的 pons asini [傻瓜的绊脚石]<sup><a id="ZF1" href="#F1">①</a></sup>。</p>
