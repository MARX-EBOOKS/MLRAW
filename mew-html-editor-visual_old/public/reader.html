<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEW 对照阅读编辑器</title><link rel="stylesheet" href="/vendor/pdfjs/web/pdf_viewer.css"><link rel="stylesheet" href="reader.css"><link rel="stylesheet" href="reader-vscode.css"></head>
<body>
<header class="site-header">
  <div class="brand"><span aria-hidden="true">M</span><span class="brand-name">MEW 对照阅读编辑器</span></div>
  <div class="context"><strong id="chapterTitle">正在载入…</strong><div class="context-meta"><small id="pageContext"></small><output id="status" aria-live="polite" aria-atomic="true"></output></div></div>
  <nav class="actions" aria-label="阅读与编辑工具">
    <div class="action-group action-group-file"><select id="volumeSelect" aria-label="选择卷册" title="选择卷册"></select><button id="tocBtn" type="button" aria-controls="tocDrawer" aria-expanded="false">目录</button></div>
    <div class="action-group action-group-page"><form id="pageForm" aria-label="跳转页码"><input id="pageInput" type="number" min="1" inputmode="numeric" aria-label="页码" placeholder="页码"><button type="submit">跳转</button></form></div>
    <div class="action-group action-group-edit"><button id="undoBtn" type="button" title="撤销 Ctrl+Z">撤销</button><button id="redoBtn" type="button" title="重做 Ctrl+Y">重做</button><button id="saveBtn" type="button" title="保存 Ctrl+S">保存</button></div>
    <div class="action-group action-group-view"><button id="modeBtn" type="button">源代码</button><button id="darkBtn" type="button">深色</button></div>
  </nav>
</header>
<button id="tocBackdrop" class="toc-backdrop" aria-label="关闭目录"></button>
<aside id="tocDrawer" class="toc-drawer" aria-labelledby="tocTitle"><div class="toc-header"><strong id="tocTitle">目录</strong><button id="tocClose" type="button" aria-label="关闭目录">×</button></div><ol id="tocList"></ol></aside>
<main class="reader-grid">
  <section class="text-pane">
    <div id="tagBar" class="tag-bar"></div>
    <iframe id="visualEditor" title="可视化编辑器" sandbox="allow-same-origin"></iframe>
    <div id="sourcePane" class="source-pane" hidden>
        <div id="findBar" class="find-bar"><textarea id="findText" rows="2" spellcheck="false" placeholder="查找文本或正则"></textarea><textarea id="replaceText" rows="2" spellcheck="false" placeholder="替换为"></textarea>
        <label><input id="regexBox" type="checkbox" checked>正则</label><label><input id="caseBox" type="checkbox">区分大小写</label>
        <button id="findBtn">查找</button><button id="nextBtn">下一个</button><button id="replaceBtn">替换</button><button id="allBtn">全部</button><span id="findInfo"></span>
      </div>
      <div class="editor-wrap"><pre id="highlight"></pre><textarea id="editor" spellcheck="false"></textarea></div>
    </div>
  </section>
  <aside class="scan-pane"><div class="scan-tools" role="toolbar" aria-label="PDF 扫描工具"><div class="scan-tool-group"><button id="pdfDirection" type="button" aria-pressed="false">左右翻页</button><button id="imageInvert" type="button" aria-pressed="false" title="反转 PDF 页面颜色，并记住此设置">反色</button></div><div class="scan-tool-group zoom-tools" aria-label="PDF 缩放"><button id="zoomOut" type="button" title="缩小 PDF" aria-label="缩小 PDF">−</button><button id="zoomFit" type="button" title="当前 PDF.js 缩放比例；点击适合页宽">适合页宽</button><button id="zoomIn" type="button" title="放大 PDF" aria-label="放大 PDF">＋</button></div><div class="scan-tool-group"><button id="fullImage" type="button">全屏</button></div></div>
    <div id="scanStage" tabindex="0" aria-label="PDF 浏览器"><div id="pdfViewer" class="pdfViewer"></div><p id="scanMissing">正在载入 PDF…</p></div>
  </aside>
</main>
<footer class="page-footer" aria-label="翻页导航"><button id="prevBtn" type="button" title="Alt+←">← 上一页</button><span id="pagePosition" aria-live="polite"></span><button id="nextPageBtn" type="button" title="Alt+→">下一页 →</button></footer>
<script src="reader-ui.js"></script><script src="reader-app.js"></script></body></html>
